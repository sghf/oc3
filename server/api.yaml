          type: string
        obs_warn_date:
          type: string
        obs_alert_date:
          type: string
        obs_warn_date_updated_by:
          type: string
        obs_alert_date_updated_by:
          type: string
        obs_warn_date_updated:
          type: string
        obs_alert_date_updated:
