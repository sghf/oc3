              schema:
                $ref: '#/components/schemas/UserListResponse'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

    post:
      operationId: PostUsers
      description: |
        Create a user, with its private group "user_<id>". Requires the UserManager
        privilege. An email or username already in use is refused with a 409. Without
        a password the account exists but cannot sign in with one. A password is
        refused with a 400 when password sign-in is disabled (server.auth.basic_users
        false).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                username:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                phone_work:
                  type: string
                password:
                  type: string
                  description: At least 8 characters. Stored as a web2py hash.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /users/self/filterset:
    get:
      operationId: GetUserSelfFilterset
      description: |
        The session filterset of the signed-in user, or null data. As in the
        historical collector, it narrows every list naming a node or a service to the
        filterset's nodes and services (a row without a node, or without a service,
        is judged on the other side), the dashboard and its counters included, and
        it is what the %%fset_node_ids%% and %%fset_svc_ids%% placeholders of a
        metric stand for. Single records read by their id are not narrowed.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionFiltersetResponse'
        401:
          $ref: '#/components/responses/401'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    put:
      operationId: PutUserSelfFilterset
      description: |
        Choose the session filterset of the signed-in user, by id or name, in place
        of the previous one. Refused while acting as another user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fset_id]
              properties:
                fset_id:
                  type: string
                  description: Filterset id (gen_filtersets.id) or name
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionFiltersetResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    delete:
      operationId: DeleteUserSelfFilterset
      description: |
        Remove the session filterset of the signed-in user: the lists show everything
        the user may see again. Refused while acting as another user.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionFiltersetResponse'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /users/self/password:
    post:
      operationId: PostUserSelfPassword
      description: |
        Change the password of the signed-in user, who gives the current one. The new
        password must be at least 12 characters long and differ from the current one;
        it is stored as a web2py hash, accepted by both collectors. The change is
        logged, without the password. Requires user authentication, no privilege; a
        user signed in through the identity provider (OIDC session or Bearer token)
        is refused with 403, the provider managing their password, and so is anyone
        when password sign-in is disabled (server.auth.basic_users false).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
                  description: At least 12 characters.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  info:
                    type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

