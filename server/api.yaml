        - bearerAuth: [ ]

  /auth/node:
    post:
      description: |
        Register a node authentication
      operationId: PostAuthNode
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required:
                - nodename
              properties:
                nodename:
                  type: string
                app:
                  type: string
      responses:
        200:
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - uuid
                  - info
                properties:
                  uuid:
                    type: string
                  info:
                    type: string
        403:
          $ref: '#/components/responses/403'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - { }
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - auth

  /disks:
