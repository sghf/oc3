          type: string
        svc_config_updated:
          type: string
        svc_metrocluster:
          type: string
        svc_drnoaction:
          type: string
        svc_notifications:
          type: string
        svc_snooze_till:
          type: string
        updated:
          type: string

    ServiceListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ServiceRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    AlertRow:
      type: object
      description: |
        A dashboard alert row. Every property is optional: the `props` query
        parameter selects which columns the server returns. `alert` is computed
        from `dash_fmt` and `dash_dict`. The `nodes.` and `services.` properties
        come from a LEFT JOIN and are null when the alert targets the other kind
        of object.
      properties:
        id:
          type: integer
        dash_type:
          type: string
        svc_id:
          type: string
        node_id:
          type: string
        dash_severity:
          type: integer
        dash_fmt:
          type: string
        dash_dict:
          type: string
        dash_created:
          type: string
        dash_updated:
          type: string
        dash_md5:
          type: string
        dash_dict_md5:
          type: string
        dash_env:
          type: string
        dash_instance:
          type: string
        alert:
          type: string
          description: Human readable message, rendered from dash_fmt and dash_dict.
        nodes.nodename:
          type: string
          nullable: true
        services.svcname:
          type: string
          nullable: true

    AlertListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/AlertRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    AppRow:
      type: object
      description: |
        An application code. Every property is optional: the `props` query
        parameter selects which columns the server returns.
      properties:
        id:
          type: integer
        app:
          type: string
        updated:
          type: string
        app_domain:
          type: string
        app_team_ops:
          type: string
        description:
          type: string

    AppListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/AppRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    InfoResponse:
      type: object
      description: Outcome message of a write that returns no record.
      properties:
        info:
          type: string

    IpRow:
      type: object
      description: |
        An IP address detected on a node, joined to the network it belongs to.
        Every property is optional: the `props` query parameter selects which
        columns the server returns.
      properties:
        id:
          type: integer
        node_id:
          type: string
        nodename:
          type: string
        intf:
          type: string
        mac:
          type: string
        type:
          type: string
        addr:
          type: string
        mask:
          type: string
        updated:
          type: string
        flag_deprecated:
          type: integer
        net_id:
          type: integer
        net_name:
          type: string
        net_network:
          type: string
        net_netmask:
          type: string
        net_broadcast:
          type: string
        net_gateway:
          type: string
        net_begin:
          type: string
        net_end:
          type: string
        net_pvid:
          type: string
        net_prio:
          type: integer
        net_comment:
          type: string
        net_team_responsible:
          type: string

    IpListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/IpRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    DiskRow:
      type: object
      description: |
        A disk seen on a node, with the service and array it belongs to when
        known. Every property is optional: the `props` query parameter selects
        which columns the server returns.
      properties:
        disk_id:
          type: string
        disk_name:
          type: string
        disk_devid:
          type: string
        disk_vendor:
          type: string
        disk_model:
          type: string
        disk_size:
          type: integer
        disk_used:
          type: integer
        disk_alloc:
          type: integer
        disk_raid:
          type: string
        disk_group:
          type: string
        disk_level:
          type: integer
        disk_arrayid:
          type: string
        disk_dg:
          type: string
        disk_region:
          type: string
        node_id:
          type: string
        nodename:
          type: string
        svc_id:
          type: string
        svcname:
          type: string
        app:
          type: string
        updated:
          type: string

    DiskListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/DiskRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    GroupRow:
      type: object
      description: |
        A user group. `privilege` is "T" for a privilege-granting group and
        "F" for an ordinary one. Every property is optional: the `props` query
        parameter selects which columns the server returns.
      properties:
        id:
          type: integer
        role:
          type: string
        privilege:
          type: string
        description:
          type: string

    GroupListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/GroupRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    UserRow:
      type: object
      description: |
        A user of the users list. `password` and `registration_key` are never
        returned. The boolean-like columns (`email_notifications`,
        `im_notifications`, `lock_filter`) carry the collector's "T"/"F"
        convention, and the delay and quota columns are returned as strings.
        Every property is optional: the `props` query parameter selects which
        columns the server returns.
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone_work:
          type: string
        im_type:
          type: string
        im_username:
          type: string
        email_notifications:
          type: string
        im_notifications:
          type: string
        email_log_level:
          type: string
        im_log_level:
          type: string
        email_notifications_delay:
          type: string
        im_notifications_delay:
          type: string
        lock_filter:
          type: string
        registration_id:
          type: string
        reset_password_key:
          type: string
        quota_app:
          type: string
        quota_org_group:
          type: string
        quota_docker_registries:
          type: string

    UserPrefsResponse:
      type: object
      required:
        - data
      description: |
        The stored preferences, as saved by POST /users/{user_id}/prefs. The
        collector never interprets the content; an empty object means "no
        preferences stored", "user unknown" or "user not visible" alike.
      properties:
        data:
          type: object
          additionalProperties: true

    UserListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/UserRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    ListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                type: object
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    Problem:
      type: object
      properties:
        text:
          description: |
            A human-readable explanation specific to this occurrence of the
            problem.
          type: string
      required:
        - text

    version:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          example: "0.0.1"

  parameters:
    ObjectPathHeader:
      name: OC3-ObjectPath
      in: header
      schema:
        type: string

    inPathMsetId:
      in: path
      name: mset_id
      required: true
      description: ID of the moduleset
      schema:
        type: string

    inPathNodeId:
      in: path
      name: node_id
      required: true
      description: ID of the node
      schema:
        type: string

    inPathRsetId:
      in: path
      name: rset_id
      required: true
      description: ID of the ruleset
      schema:
        type: string

    inQueryGroupby:
      in: query
      name: groupby
      required: false
      description: Comma-separated list of properties to group the result by (e.g. groupby=app,svcname).
      schema:
        type: string

    inQueryLimit:
      in: query
      name: limit
      required: false
      description: The maximum number of entries to return. 0 means no limit.
      schema:
        type: integer
        minimum: 0
        default: 50

    inQueryMeta:
      in: query
      name: meta
      required: false
      description: Include metadata in the response. Enabled by default. Use false or 0 to omit the meta field.
      schema:
        type: string

    inQueryOffset:
      in: query
      name: offset
      required: false
      description: Skip the first entries of the data cursor.
      schema:
        type: integer
        minimum: 0
        default: 0

    inQueryOrderby:
      in: query
      name: orderby
      required: false
      description: Comma-separated list of properties to sort by. Prefix a property with - for descending order (e.g. orderby=nodename,-app).
      schema:
        type: string

    inQueryProps:
      in: query
      name: props
      required: false
      description: A list of properties to include in each data dictionnary.
      schema:
        type: string

    inQueryStats:
      in: query
      name: stats
      required: false
      description: Controls the inclusion in the returned dictionnary of a "stats" key, containing the selected properties distinct values counts.
      schema:
        type: string

    inQuerySync:
      in: query
      name: sync
      schema:
        type: boolean

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
