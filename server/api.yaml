        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /compliance/status/summary:
    get:
      operationId: GetComplianceStatusSummary
      description: |
        Count the last check runs of the modules, among those `GET /compliance/status`
        lists with the same filters (the session filterset included): ok, not ok and
        not applicable among the runs of the last 7 days, obsolete past them, their
        total and the share of ok and not applicable runs (`pct`). Overall in
        `totals`, and per module, node or service in `data` when `by` asks for it,
        the least compliant first, then the largest, then by name, as the historical
        compliance status views. The runs of no service are left out of the service
        groups.
      parameters:
        - in: query
          name: by
          required: false
          description: Group the counts per module, node or service.
          schema:
            type: string
            enum: [module, node, service]
        - $ref: '#/components/parameters/inQueryFilter'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceStatusSummaryResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /compliance/status/{status_id}:
    get:
      operationId: GetComplianceStatusRun
      description: |
        Display the last check run of a module-node-service tuple.
      parameters:
        - in: path
          name: status_id
          required: true
          description: Id of the run (comp_status.id)
          schema:
