            type: string
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
        - $ref: '#/components/parameters/inQueryStats'
        - $ref: '#/components/parameters/inQueryOrderby'
        - $ref: '#/components/parameters/inQueryGroupby'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    delete:
      operationId: DeleteUser
      description: |
        Delete a user, as the historical rest_delete_user does, then clean up what
        belongs to the account alone: its team memberships, its private team
        (user_<id>, and what references it), its OpenID Connect identities, its
        session filter, its preferences, its report and comparison selections and
        its read marks of the log. What records history stays: the audit log, the
        action queue, the alerts sent. UserManager privilege required. Refused for
        one's own account, for the account of a Manager unless the caller is a
        Manager, and for the last member of the Manager team.
      parameters:
        - in: path
          name: user_id
          required: true
          description: User identifier, auth_user.id or the user email.
          schema:
            type: string
      tags:
        - collector
      responses:
        200:
          description: OK
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    post:
      operationId: PostUser
      description: |
        Change the first name, last name or email of a user. Any signed-in user may
        change their own, as the profile form of the historical collector allows,
        unless signed in through the identity provider (OIDC session or Bearer token):
        their profile is the provider's, 403. Another user's requires the
        UserManager privilege (or Manager), else 403.
        Only the keys given are changed; names are trimmed, at most 128
        characters, and may be empty. The email must be a valid address, at most 512
        characters, not used by another user (409): it is the sign-in name, so the
        next requests must authenticate with it. The change is logged with the fields
        changed. Requires user authentication. Returns the user.
      parameters:
        - in: path
          name: user_id
          required: true
          description: |
            User identifier: auth_user.id, the user email when it contains an
            "@", or "self" for the authenticated user.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  maxLength: 128
                last_name:
                  type: string
                  maxLength: 128
                email:
                  type: string
                  maxLength: 512
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /impersonation:
    get:
      operationId: GetImpersonation
      description: |
        Tell whether the user who signed in may impersonate other users (the
        Manager privilege), and which user the request is made as when it
        carries the OC3-Impersonate header. Requires user authentication.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationStatus'
        401:
          $ref: '#/components/responses/401'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /users/{user_id}/groups:
    get:
      operationId: GetUserGroups
      description: |
        List the groups the user is member of, organisational and privilege ones.
        Managers and UserManager see every user's groups; other users only those
        of the users sharing one of their organisational groups, and their own.
      parameters:
        - in: path
          name: user_id
          required: true
          description: |
            User identifier: auth_user.id, the user email when it contains an
            "@", or "self" for the authenticated user.
          schema:
            type: string
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
        - $ref: '#/components/parameters/inQueryStats'
        - $ref: '#/components/parameters/inQueryOrderby'
        - $ref: '#/components/parameters/inQueryFilter'
        - $ref: '#/components/parameters/inQueryGroupby'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
        401:
          $ref: '#/components/responses/401'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /users/{user_id}/groups/{group_id}:
    post:
      operationId: PostUserGroup
      description: |
        Make the user a member of the group, as rest_post_user_group does.
        Requires the GroupManager privilege; a caller who is not a Manager can only
        attach a group they are member of. Attaching a user already member is not
        an error. The change is logged.
      parameters:
        - in: path
          name: user_id
          required: true
          description: User identifier, auth_user.id or email.
          schema:
            type: string
        - in: path
          name: group_id
          required: true
          description: Group identifier, auth_group.id or role.
          schema:
            type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  info:
                    type: string
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    delete:
      operationId: DeleteUserGroup
      description: |
        Remove the user from the group, as rest_delete_user_group does, with the
        same privilege rules as the attachment. Detaching a user who is not member
        is not an error. The change is logged.
      parameters:
        - in: path
          name: user_id
          required: true
          description: User identifier, auth_user.id or email.
          schema:
            type: string
        - in: path
          name: group_id
          required: true
          description: Group identifier, auth_group.id or role.
          schema:
            type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  info:
                    type: string
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /users/{user_id}/hidden_menu_entries:
    get:
      operationId: GetUserHiddenMenuEntries
      description: |
        The menu entries hidden to a user, as the historical collector computes
        them: an entry is hidden when every organizational group of the user
        hides it (see /groups/{group_id}/hidden_menu_entries), the Everybody
        group and the privilege groups apart; a user of no such group sees every
        entry. For "self", the user the requests are made as, impersonation
        included. Another user's requires the UserManager privilege.
      parameters:
        - in: path
          name: user_id
          required: true
          description: User identifier, auth_user.id, or "self" for the authenticated user.
          schema:
            type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HiddenMenuEntriesResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /users/{user_id}/impersonate:
    post:
      operationId: PostUserImpersonate
      description: |
        Start acting as another user, as the impersonation of the historical
        collector does. Checks that the caller may impersonate that user and logs
        the start ("User %(id)s is impersonating %(other_id)s"). The requests made
        as that user then carry its id in the OC3-Impersonate header: the server
        handles them with the identity, the groups and the visibility of that
        user, checks the privilege again on every request, and answers with the
        OC3-Impersonated-By header naming the user who signed in. A refusal due to
        the impersonation itself carries OC3-Impersonation-Refused. Stopping is
        dropping the header. Requires the Manager privilege, and a request not
        already made as another user.
      parameters:
        - in: path
          name: user_id
          required: true
          description: User identifier, auth_user.id or email.
          schema:
            type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Impersonation'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /users/{user_id}/prefs:
    get:
      operationId: GetUserPrefs
      description: |
        Fetch the user preferences: visible columns, column filters, live mode
        enabled flag, hidden group entries, ...

        Returns an empty object when the user has no preferences stored, and
        also when the user does not exist or is not visible to the caller.
      parameters:
        - in: path
          name: user_id
          required: true
          description: |
            User identifier: auth_user.id, the user email when it contains an
            "@", or "self" for the authenticated user.
          schema:
            type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPrefsResponse'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

    post:
      operationId: PostUserPrefs
      description: |
        Save the user preferences: visible columns, column filters, live mode
        enabled flag, hidden group entries, ...
      parameters:
        - in: path
          name: user_id
          required: true
          description: |
            User identifier: auth_user.id, the user email when it contains an
            "@", or "self" for the authenticated user.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: object
                  additionalProperties: true
                  description: The preferences object, stored verbatim.
                uuid:
                  type: string
                  description: |
                    Opaque sender identifier echoed in the user_prefs_change
                    event, so a client can ignore its own update.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /version:
    get:
      operationId: GetVersion
      description: return api version
      tags:
        - capabilities
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/version'
        500:
          $ref: '#/components/responses/500'

  /workflows:
    get:
      operationId: GetWorkflows
      description: |
        List the requests: the workflows started by the submission of a form with a
        workflow output. A manager sees every request; the others see those they
        or one of their teams take part in: created, are assigned, or submitted or
        were assigned one of its steps (the historical API listed every workflow
        to any authenticated user). `form_name`,
        `form_folder` and `form_yaml` are those of the form revision the request
        started from.
      parameters:
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
        - $ref: '#/components/parameters/inQueryStats'
        - $ref: '#/components/parameters/inQueryOrderby'
        - $ref: '#/components/parameters/inQueryFilter'
        - $ref: '#/components/parameters/inQueryGroupby'
        - in: query
          name: assigned
          description: |
            Keep the pending workflows (status not closed) related to the caller's
            team, the caller's full name and the roles of their non-privilege
            groups: `team` those whose last assignee is in the team, as the
            historical "Assigned to my team"; `tiers` those created by the team and
            assigned to someone else, as the historical "Pending tiers action".
          schema:
            type: string
            enum: [team, tiers]
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
        401:
          $ref: '#/components/responses/401'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /compliance/attachments:
    post:
      operationId: PostComplianceAttachments
      description: |
        Attach or detach modulesets and rulesets on nodes and services in bulk.
        Each pair goes through the checks of its single route (POST and DELETE
        /nodes/{node_id}/compliance/modulesets/{mset_id}, and the like for the
        rulesets and the services): the caller's responsibility for the node or
        the service, the moduleset or ruleset, whether it is attached already or
        still, and, to attach, whether it may be attached there. A pair refused
        does not stop the others: the response gives the outcome of each, in the
        order of the request, with the status and the message its single route
        answers with. At most 1000 pairs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplianceAttachmentsInput'
      tags:
        - collector
      responses:
        200:
          description: The outcome of each pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceAttachmentsResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /compliance/logs:
    get:
      operationId: GetComplianceLogs
      description: |
        List the compliance modules' check, fixable and fix runs of the nodes the
        user can see: those whose app is published to one of the user's groups, every
        node for a manager. The most recent first by default. The nodes.* and
        services.* props give the node and service names.
      parameters:
        - in: query
          name: fset_id
          required: false
          description: Restrict to the runs of the nodes this filterset selects (gen_filtersets.id or fset_name)
          schema:
            type: string
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
        - $ref: '#/components/parameters/inQueryStats'
        - $ref: '#/components/parameters/inQueryOrderby'
        - $ref: '#/components/parameters/inQueryFilter'
        - $ref: '#/components/parameters/inQueryGroupby'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceLogListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /compliance/logs/{log_id}:
    get:
      operationId: GetComplianceLog
      description: |
        Display the properties of a module run.
      parameters:
        - in: path
          name: log_id
          required: true
          description: Id of the run (comp_log.id)
