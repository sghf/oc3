openapi: 3.0.0

servers:
  - url: ./

info:
  title: opensvc collector api
  version: 1.0.4

paths:
  /actions:
    get:
      operationId: GetActions
      description: |
        List service and node actions posted in the action_queue. Managers see
        all actions; other users only see actions of nodes whose app they are
        responsible for.
      parameters:
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
        - $ref: '#/components/parameters/inQueryStats'
        - $ref: '#/components/parameters/inQueryOrderby'
        - $ref: '#/components/parameters/inQueryFilter'
        - $ref: '#/components/parameters/inQueryGroupby'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    post:
      operationId: PostActions
      description: |
        Modify an action_queue entry. The 'id' key is mandatory and selects the
        target action; only the 'status' property is updatable. Requires the
        NodeExec or CompExec privilege and responsibility for the target node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: Action queue entry id
                status:
                  type: string
                  description: New status (the only updatable property)
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    put:
      operationId: PutActions
      description: |
        Enqueue agent actions, as the historical collector's PUT /actions does. The
        body is one entry, or a list of entries; the fields present select the
        target:

        - node_id and svc_id: an action on that instance of the service, acting on
          that node only (--local), or on the resources given by rid (--rid).
          Requires the NodeExec privilege and responsibility for the service.
        - svc_id alone: an action on the whole service, posted for a node of the
          service seen alive in the last 15 minutes. Same requirements.
        - node_id alone: a node action. Requires the NodeExec privilege (CompExec
          for compliance_check and compliance_fix) and responsibility for the node.
        - cluster_id alone: an action on the whole cluster, posted for a node of the
          cluster seen alive in the last 15 minutes and running the om3 agent,
          which runs it on every node of the cluster (`om node <action> --node *`).
          Requires the NodeExec privilege and responsibility for every node of the
          cluster.

        Accepted actions: push resinfo, push config, start, stop, giveback,
        switch, abort, clear, freeze and thaw on a service; the same, and restart,
        takeover, syncall, syncnodes, syncdrp, enable, disable, compliance_check
        and compliance_fix (CompExec privilege, on every module attached to the
        service) on an instance or on its resources; pushasset, pushdisks, pushpkg, pushpatch, pushstats,
        checks, sysreport, updatecomp, updatepkg, scanscsi,
        reboot, schedule_reboot, unschedule_reboot, shutdown, drain,
        compliance_check, compliance_fix (on every module attached to the node),
        freeze and thaw on a node; freeze, thaw and abort (of the running
        orchestration) on a cluster. Compliance actions on a given module, moduleset
        or ruleset, Wake On LAN, the root password rotation and agent options are
        not supported.

        One entry answers with the queued action, as GET /actions/{id} does, or
        with a problem. A list always answers 200, with the queued actions in
        data and one message per refused entry in error, and in refusals the
        index of each refused entry in the list with its reason; entries
        differing only by rid are merged into one action on those resources, a
        refusal then naming each of them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ActionEnqueue'
                - type: array
                  items:
                    $ref: '#/components/schemas/ActionEnqueue'
      tags:
        - collector
      responses:
        200:
          description: |
            The queued action for one entry; for a list, an object with the
            queued actions in data and the refusals in error and refusals.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - $ref: '#/components/schemas/ActionEnqueueListResult'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /actions/{id}:
    get:
      operationId: GetAction
      description: |
        Display the properties of a specific action posted in the action queue.
        Managers see all actions; other users only see actions of nodes they are
        responsible for.
      parameters:
        - in: path
          name: id
          required: true
          description: Action queue entry id
          schema:
            type: string
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
        - $ref: '#/components/parameters/inQueryStats'
        - $ref: '#/components/parameters/inQueryOrderby'
        - $ref: '#/components/parameters/inQueryGroupby'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    delete:
      operationId: DeleteAction
      description: |
        Delete an action posted in the action queue. Requires the NodeManager
        privilege and responsibility for the target node. The action is logged
        and a change notification is emitted.
      parameters:
        - in: path
          name: id
          required: true
          description: Action queue entry id
          schema:
            type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  info:
                    type: string
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /alerts:
    get:
      operationId: GetAlerts
      description: |
        List existing alerts (dashboard table). The virtual 'alert' property is
        the human-readable message rendered from dash_fmt and dash_dict.
      parameters:
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
        - $ref: '#/components/parameters/inQueryStats'
        - $ref: '#/components/parameters/inQueryOrderby'
        - $ref: '#/components/parameters/inQueryFilter'
        - $ref: '#/components/parameters/inQueryGroupby'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertListResponse'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    delete:
      operationId: DeleteAlerts
      description: |
        Delete an alert (bulk form). The first alert matching all the provided
        equality criteria (id, dash_type, node_id, svc_id, dash_instance, …) is
        deleted. A node may only delete its own alerts; other users need the
        AlertsManager privilege.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                dash_type:
                  type: string
                node_id:
                  type: string
                svc_id:
                  type: string
                dash_instance:
                  type: string
                dash_severity:
                  type: integer
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  info:
                    type: string
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    post:
      operationId: PostAlerts
      description: |
        Create or update an alert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dash_type
              properties:
                dash_type:
                  type: string
                dash_instance:
                  type: string
                node_id:
                  type: string
                svc_id:
                  type: string
                dash_fmt:
                  type: string
                dash_dict:
                  type: object
                dash_severity:
                  type: integer
                base_severity:
                  type: integer
                dash_env:
                  type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /alerts/delete:
    post:
      operationId: PostAlertsDelete
      description: |
        Delete alerts by id, up to 10000 at once, as DELETE /alerts/{id} does
        one by one: in one transaction, a single entry in the audit log naming
        their count and types, and a single change event. The ids not found, deleted
        already say, are told in not_found and do not stop the others. Requires
        the AlertsManager privilege. The checks that raised an alert raise it again
        at their next run if the cause remains.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertsDeleteInput'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertsDeleteResult'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /alerts/{id}:
    get:
      operationId: GetAlert
      description: Display an alert properties (dashboard table).
      parameters:
        - in: path
          name: id
          required: true
          description: Alert id (dashboard.id)
          schema:
            type: string
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
        - $ref: '#/components/parameters/inQueryStats'
        - $ref: '#/components/parameters/inQueryOrderby'
        - $ref: '#/components/parameters/inQueryGroupby'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertListResponse'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    delete:
      operationId: DeleteAlert
      description: |
        Delete an alert. A node may only delete alerts assigned to it; other
        users need the AlertsManager privilege. The action is logged and a
        change notification is emitted.
      parameters:
        - in: path
          name: id
          required: true
          description: Alert id (dashboard.id)
          schema:
            type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  info:
                    type: string
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    post:
      operationId: PostAlert
      description: |
        Update an alert's properties. Requires the AlertsManager privilege. The
        dash_env is recomputed from svc_id/node_id, dash_dict compatibility with
        dash_fmt is validated, and the severity is clamped.
      parameters:
        - in: path
          name: id
          required: true
          description: Alert id (dashboard.id)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dash_type:
                  type: string
                dash_instance:
                  type: string
                node_id:
                  type: string
                svc_id:
                  type: string
                dash_fmt:
                  type: string
                dash_dict:
                  type: object
                dash_severity:
                  type: integer
                base_severity:
                  type: integer
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /alerts/{id}/events:
    get:
      operationId: GetAlertEvents
      description: |
        The past occurrences of an alert, as the timeline of the historical alert
        properties shows them (alert_timeline): the dashboard_events of the same
        dash_md5, node and service, oldest first, the last `limit` of them (1000
        by default). The alert must be visible to the caller, by the dashboard rule.
        An occurrence still open has no end. The current occurrence of an alert
        the database did not record (no open event) is not listed: the alert
        itself, active since dash_created, stands for it.
      parameters:
        - in: path
          name: id
          required: true
          description: Alert id (dashboard.id)
          schema:
            type: string
        - in: query
          name: limit
          description: The most recent occurrences to return, 1000 by default, 10000 at most.
          schema:
            type: integer
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertEvent'
                  truncated:
                    type: boolean
                    description: Older occurrences were left out.
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /alert_event:
    get:
      operationId: GetAlertEvent
      description: |
        Display alert events time ranges (dashboard_events table). A row is
        visible when its service or its node is visible to the caller; managers
        see everything.
      parameters:
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
        - $ref: '#/components/parameters/inQueryStats'
        - $ref: '#/components/parameters/inQueryOrderby'
        - $ref: '#/components/parameters/inQueryGroupby'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /apps:
    get:
      operationId: GetApps
      description: List available apps
      parameters:
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
        - $ref: '#/components/parameters/inQueryStats'
        - $ref: '#/components/parameters/inQueryOrderby'
        - $ref: '#/components/parameters/inQueryGroupby'
        - $ref: '#/components/parameters/inQueryFilter'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppListResponse'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

    post:
      operationId: PostApps
      description: Create an application code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - app
              properties:
                app:
                  type: string
                description:
                  type: string
                app_domain:
                  type: string
                app_team_ops:
                  type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppRow'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

    delete:
      operationId: DeleteApps
      description: |
        Delete an application code (bulk form). Either the 'id' or the 'app'
        key is mandatory in the body and selects the target app; the deletion
        is then handled as DELETE /apps/{app_id}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: App record id
                app:
                  type: string
                  description: App code
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  info:
                    type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /apps/{app_id}:
    post:
      operationId: PostApp
      description: |
        Change the properties of an application code. Renaming it renames it on its
        nodes and services too. app is trimmed and may be neither empty, nor longer
        than 64 characters, nor the code of another application, compared without
        regard to case (409); app_domain is 64 characters at most; app_team_ops is
        empty or the name of an organizational group. Requires the AppManager
        privilege and the responsibility of the app, which a Manager has.
        app_domain constrained in strict or regex mode (see /field_constraints)
        may only take an allowed value, an empty one or the value it holds: 400
        otherwise.
      parameters:
        - in: path
          name: app_id
          required: true
          description: App record id or app code
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app:
                  type: string
                description:
                  type: string
                app_domain:
                  type: string
                app_team_ops:
                  type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppRow'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    get:
      operationId: GetApp
      description: Display app properties
      parameters:
        - in: path
          name: app_id
          required: true
          description: App record id or app code
          schema:
            type: string
        - $ref: '#/components/parameters/inQueryProps'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppRow'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    delete:
      operationId: DeleteApp
      description: Delete an application code
      parameters:
        - in: path
          name: app_id
          required: true
          description: App record id or app code
          schema:
            type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /apps_responsibles:
    post:
      operationId: PostAppsResponsibles
      description: |
        Attach a responsible group to an application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - app_id
                - group_id
              properties:
                app_id:
                  type: string
                  description: App record id or app code
                group_id:
                  type: string
                  description: Group record id or group role
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  info:
                    type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    delete:
      operationId: DeleteAppsResponsibles
      description: |
        Detach a responsible group from an application code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - app_id
                - group_id
              properties:
                app_id:
                  type: string
                  description: App record id or app code
                group_id:
                  type: string
                  description: Group record id or group role
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  info:
                    type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /apps_publications:
    post:
      operationId: PostAppsPublications
      description: |
        Attach a publication group to an application.
      requestBody:
