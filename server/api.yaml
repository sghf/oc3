  /users/{user_id}/prefs:
    get:
      operationId: GetUserPrefs
      description: |
        Fetch the user preferences: visible columns, column filters, live mode
        enabled flag, hidden group entries, ...

        Returns an empty object when the user has no preferences stored, and
        also when the user does not exist or is not visible to the caller.
      parameters:
        - in: path
          name: user_id
          required: true
          description: |
            User identifier: auth_user.id, the user email when it contains an
            "@", or "self" for the authenticated user.
          schema:
            type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPrefsResponse'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

    post:
      operationId: PostUserPrefs
      description: |
        Save the user preferences: visible columns, column filters, live mode
        enabled flag, hidden group entries, ...
      parameters:
        - in: path
          name: user_id
          required: true
          description: |
            User identifier: auth_user.id, the user email when it contains an
            "@", or "self" for the authenticated user.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: object
                  additionalProperties: true
                  description: The preferences object, stored verbatim.
                uuid:
                  type: string
                  description: |
                    Opaque sender identifier echoed in the user_prefs_change
                    event, so a client can ignore its own update.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /version:
    get:
      operationId: GetVersion
      description: return api version
      tags:
        - capabilities
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/version'
        500:
          $ref: '#/components/responses/500'

components:

  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '204':
      description: No Content
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '408':
      description: Request Timeout
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '409':
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '503':
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    ListMeta:
      type: object
      required:
      properties:
        count:
          type: integer
        available_props:
          type: array
          items:
            type: string
        included_props:
          type: array
          items:
            type: string
        limit:
          type: integer
        offset:
          type: integer
        distinct:
          type: object
          additionalProperties:
            type: integer
        total:
          type: integer

    NodeRow:
      type: object
      description: |
        A node row of the nodes list. Every property is optional: the `props`
        query parameter selects which columns the server returns, so a row
        carries only the requested subset.
      properties:
        node_id:
          type: string
        nodename:
          type: string
        app:
          type: string
        node_env:
          type: string
        cluster_id:
          type: string
        loc_country:
          type: string
        loc_city:
          type: string
        loc_addr:
          type: string
        loc_building:
          type: string
        loc_floor:
          type: string
        loc_room:
          type: string
        loc_rack:
          type: string
        loc_zip:
          type: string
        cpu_freq:
          type: string
        cpu_cores:
          type: integer
        cpu_dies:
          type: integer
        cpu_vendor:
          type: string
        cpu_model:
          type: string
        cpu_threads:
          type: integer
        mem_banks:
          type: integer
        mem_slots:
          type: integer
        mem_bytes:
          type: integer
        os_name:
          type: string
        os_release:
          type: string
        os_update:
          type: string
        os_segment:
          type: string
        os_arch:
          type: string
        os_vendor:
          type: string
        os_kernel:
          type: string
        os_concat:
          type: string
        team_responsible:
          type: string
        team_integ:
          type: string
        team_support:
          type: string
        serial:
          type: string
        model:
          type: string
        manufacturer:
          type: string
        type:
          type: string
        assetname:
          type: string
        asset_env:
          type: string
        warranty_end:
          type: string
        maintenance_end:
          type: string
        status:
          type: string
        role:
          type: string
        sec_zone:
          type: string
        power_cabinet1:
          type: string
        power_cabinet2:
          type: string
        power_supply_nb:
          type: integer
        power_protect:
          type: string
        power_protect_breaker:
          type: string
        power_breaker1:
          type: string
        power_breaker2:
