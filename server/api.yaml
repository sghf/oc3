        - bearerAuth: [ ]

  /assistant/conversations/{conversation_id}/turns/{turn_id}/confirmation:
    post:
      operationId: PostAssistantConfirmation
      description: |
        Approve or reject the action a turn waits on, and stream the rest of the turn.

        Relayed by oc3 to the AI agent, at the base_url and path of
        server.assistant, with the access token of the caller's single sign-on
        session, or the bearer token of the request; nothing else of the
        browser's request is forwarded. The agent's answers and error codes are
        returned as they are.
      tags:
        - assistant
      parameters:
        - in: path
          name: conversation_id
          required: true
          schema:
            type: string
        - in: path
          name: turn_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantConfirmationRequest'
      responses:
        200:
          description: The turn, streamed as server-sent events.
          content:
            text/event-stream:
              schema:
                description: "The schema of each event of the stream, written as `event: <type>` then `data: <the event as JSON>` and an empty line; the stream ends after completed, confirmation_required or error."
                allOf:
                  - $ref: '#/components/schemas/AssistantStreamEvent'
        401:
          description: No access token for the caller - a password sign-in, or a single sign-on session to open again (assistant_token_unavailable) - or the agent refused it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
        403:
          description: Not while impersonating (assistant_forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
        404:
          description: The assistant is not configured (assistant_disabled), or the conversation does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
        502:
          description: The agent could not be reached, or answered badly (assistant_unreachable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
        503:
          description: The agent is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
        400:
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
        409:
          description: A turn is running, an action waits a decision, or a limit is reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
        410:
          description: The conversation has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
        413:
          description: The prompt is too large.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /assistant/conversations/{conversation_id}/turns/{turn_id}/feedback:
    parameters:
      - in: path
        name: conversation_id
        required: true
        schema:
          type: string
      - in: path
        name: turn_id
        required: true
        schema:
          type: string
    put:
      operationId: PutAssistantFeedback
      description: |
        Give or replace the feedback of the user on a completed turn: up or down,
        and for down, the reasons and what was expected. The agent keeps a copy
        of the turn for review, without the identity of the user.

        Relayed by oc3 to the AI agent, at the base_url and path of
        server.assistant, with the access token of the caller's single sign-on
        session, or the bearer token of the request; nothing else of the
        browser's request is forwarded. The agent's answers and error codes are
        returned as they are.
      tags:
        - assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantFeedbackRequest'
      responses:
        200:
          description: The feedback is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantFeedbackEnvelope'
        400:
          description: Invalid request, invalid feedback, or the turn is not completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
        401:
          description: No access token for the caller - a password sign-in, or a single sign-on session to open again (assistant_token_unavailable) - or the agent refused it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
        403:
          description: Not while impersonating (assistant_forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
        404:
          description: The assistant is not configured (assistant_disabled), or the conversation or the turn does not exist, or has no feedback to delete (feedback_target_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
        410:
          description: The conversation has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
        502:
          description: The agent could not be reached, or answered badly (assistant_unreachable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
        503:
          description: The agent is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
        409:
          description: The feedback limit of the agent is reached (feedback_limit).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
        413:
          description: The body is too large.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantError'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
