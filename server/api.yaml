        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    post:
      operationId: PostNetworks
      description: |
        Declare a network. Requires the NetworkManager privilege. `network` must be
        the IPv4 network address for `netmask`; `begin`, `end` and `broadcast` are
        computed by the database. `team_responsible` defaults to the caller's primary
        group. A name or an address already declared is refused with a 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - network
                - netmask
              properties:
                name:
                  type: string
                network:
                  type: string
                  description: IPv4 network address, for example 192.168.10.0
                netmask:
                  type: integer
                  minimum: 0
                  maximum: 32
                  description: Prefix length
                gateway:
                  type: string
                  description: IPv4 address inside the network
                comment:
                  type: string
                pvid:
                  type: integer
                  description: VLAN id
                prio:
                  type: integer
                  minimum: 0
                  maximum: 99
                  description: Priority among overlapping networks
                team_responsible:
                  type: string
                  description: Organisational group responsible for the network
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /networks/{net_id}/segments:
    post:
      operationId: PostNetworkSegments
      description: |
        Declare a segment of a network: an address range whose responsible groups
        may allocate its addresses. Requires the NetworkManager privilege and, unless
        the caller is a manager, membership of the network's responsible team. The
        range must lie inside the network and must not overlap another segment of it
        (409). The caller's primary group becomes responsible for the segment.
      parameters:
        - in: path
          name: net_id
          required: true
          description: Record id of the network
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - seg_begin
                - seg_end
              properties:
                seg_type:
                  type: string
                  enum: [static, dynamic]
                  default: static
                  description: How the addresses of the segment are allocated
                seg_begin:
                  type: string
                  description: First IPv4 address of the segment
                seg_end:
                  type: string
                  description: Last IPv4 address of the segment
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSegmentListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
