  /groups/{group_id}:
    get:
      operationId: GetGroup
      description: |
        Display group properties. Managers can see all groups; other users only
        see the groups they belong to.
      parameters:
        - in: path
          name: group_id
          required: true
          description: Group identifier (auth_group.id or role)
          schema:
            type: string
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
        - $ref: '#/components/parameters/inQueryStats'
        - $ref: '#/components/parameters/inQueryOrderby'
        - $ref: '#/components/parameters/inQueryGroupby'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    post:
      operationId: PostGroup
      description: |
        Modify the properties of a group: role (its name), description, privilege.
        The name is trimmed and may be neither empty, nor longer than 255 characters,
        nor the name of another group (409). privilege is T or F. Requires the
        GroupManager privilege; a caller who is not a Manager may change only the
        organizational groups they are member of. Changing a privilege group, or the
        privilege flag to T, requires the Manager privilege. The Everybody group is
        immutable.
      parameters:
        - in: path
          name: group_id
          required: true
          description: Group identifier (auth_group.id or role)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                description:
                  type: string
                privilege:
                  type: string
                  description: "'T' for a privilege group, 'F' otherwise"
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    delete:
      operationId: DeleteGroup
      description: |
        Delete a group and cascade delete its membership, apps/forms/rulesets/modulesets
        responsibilities and publications. Requires the GroupManager privilege. Managers
        can delete any group; other users only the non-privilege groups they belong to.
        The immutable 'Everybody' group cannot be deleted.
      parameters:
        - in: path
          name: group_id
          required: true
          description: Group identifier (auth_group.id or role)
          schema:
            type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

