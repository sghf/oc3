          description: Empty until the first successful turn, which derives it from its prompt, or until a rename.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Pushed back by each completed turn.
        stored_bytes:
          type: integer
          minimum: 0
          description: The size of the stored history.
    AssistantConversationList:
      type: object
      required:
      - conversations
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/AssistantConversation'
    AssistantConversationEnvelope:
      type: object
      required:
      - conversation
      properties:
        conversation:
          $ref: '#/components/schemas/AssistantConversation'
        pending_confirmation:
          $ref: '#/components/schemas/AssistantConfirmation'
          description: The action the conversation waits a decision on. Only the conversation read returns it.
    AssistantTitleRequest:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: Control characters are replaced by spaces and whitespace is normalized.
    AssistantTurnRequest:
      type: object
      additionalProperties: false
      required:
      - prompt
      properties:
        prompt:
          type: string
          minLength: 1
          description: The question of the user, at most 32 KiB, not blank.
    AssistantFeedbackReason:
      type: string
      description: |
        Why an answer falls short: it does not answer the question, information
        is missing, it is incorrect or outdated, it is hard to understand, the
        expected action was not done.
      enum:
      - not_answered
      - missing_information
      - incorrect_or_outdated
      - hard_to_understand
      - action_not_done
    AssistantFeedback:
      type: object
      required:
      - rating
      - reasons
      - expected
      properties:
        rating:
          type: string
          enum:
          - up
          - down
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/AssistantFeedbackReason'
        expected:
          type: string
    AssistantFeedbackRequest:
      type: object
      additionalProperties: false
      required:
      - rating
      properties:
        rating:
          type: string
          enum:
          - up
          - down
        reasons:
          type: array
          uniqueItems: true
          description: Only with down.
          items:
            $ref: '#/components/schemas/AssistantFeedbackReason'
        expected:
          type: string
          maxLength: 1000
          description: What the user would have expected, free text.
    AssistantFeedbackEnvelope:
      type: object
      required:
      - feedback
      - created_at
      - updated_at
      properties:
        feedback:
          $ref: '#/components/schemas/AssistantFeedback'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AssistantConfirmationRequest:
      type: object
      additionalProperties: false
      required:
      - confirmation_id
      - decision
      properties:
        confirmation_id:
          type: string
          minLength: 1
          description: The `id` of the confirmation.
        decision:
          type: string
          enum:
          - approve
          - reject
    AssistantConfirmation:
      type: object
      required:
      - id
