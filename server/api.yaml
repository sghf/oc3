  /metrics:
    get:
      operationId: GetMetrics
      description: |
        List the metrics: SQL requests whose results feed the charts and the
        reports. A manager sees every metric; the others see the metrics published
        to one of their teams.
      parameters:
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
        - $ref: '#/components/parameters/inQueryStats'
        - $ref: '#/components/parameters/inQueryOrderby'
        - $ref: '#/components/parameters/inQueryFilter'
        - $ref: '#/components/parameters/inQueryGroupby'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

    post:
      operationId: PostMetrics
      description: |
        Create a metric. Its name must be unique. The metric is published to the
        primary team of its author, as in the historical collector. Requires the
        Manager privilege.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - metric_name
              properties:
                metric_name:
                  type: string
                  description: Unique name of the metric.
                metric_sql:
                  type: string
                  description: |
                    The SQL request computing the metric. `%%fset_node_ids%%` and
                    `%%fset_svc_ids%%` stand for the nodes and services of the
                    filterset of the session where the metric is read.
                metric_col_value_index:
                  type: integer
                  minimum: 0
                  description: Index of the result column holding the value.
                metric_col_instance_index:
                  type: integer
                  minimum: 0
                  nullable: true
                  description: |
                    Index of the result column naming the instance of each value,
                    null when the request returns one value.
                metric_col_instance_label:
                  type: string
                  description: How the instances are named, the column header say.
                metric_historize:
                  type: string
                  enum: ['T', 'F']
                  description: Whether the values are kept over time for the charts.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /metrics/{metric_id}:
    get:
      operationId: GetMetric
      description: Display a metric, if the caller may see it (see GET /metrics).
      parameters:
        - in: path
          name: metric_id
          required: true
          description: Metric identifier (metrics.id)
          schema:
            type: string
        - $ref: '#/components/parameters/inQueryProps'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricListResponse'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

    post:
      operationId: PostMetric
      description: |
        Modify a metric. Only the properties present in the body change; a null
        `metric_col_instance_index` clears it. Requires the Manager privilege.
      parameters:
        - in: path
          name: metric_id
          required: true
          description: Metric identifier (metrics.id)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metric_name:
                  type: string
                  description: Unique name of the metric.
                metric_sql:
                  type: string
                  description: |
                    The SQL request computing the metric. `%%fset_node_ids%%` and
                    `%%fset_svc_ids%%` stand for the nodes and services of the
                    filterset of the session where the metric is read.
                metric_col_value_index:
                  type: integer
                  minimum: 0
                  description: Index of the result column holding the value.
                metric_col_instance_index:
                  type: integer
                  minimum: 0
                  nullable: true
                  description: |
                    Index of the result column naming the instance of each value,
                    null when the request returns one value.
                metric_col_instance_label:
                  type: string
                  description: How the instances are named, the column header say.
                metric_historize:
                  type: string
                  enum: ['T', 'F']
                  description: Whether the values are kept over time for the charts.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /metrics/{metric_id}/samples:
    get:
      operationId: GetMetricSamples
      description: |
        Run the request of a metric now and return its result, for a caller who may
        see the metric (see GET /metrics): the columns in order, then the rows, 1000
        at most. The request runs read-only, for 10 seconds at most, and must be a
        SELECT. Its %%fset_node_ids%% and %%fset_svc_ids%% placeholders stand for the
        nodes and services the caller may see. A request that fails returns 422 with
        the database error.
      parameters:
        - in: path
          name: metric_id
          required: true
          description: Metric identifier (metrics.id)
          schema:
            type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSamplesResponse'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        422:
          description: The request is not a SELECT, or it failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /realtime/token:
    post:
      operationId: PostRealtimeToken
      description: |
        Get a one-time token for the websocket of the messenger, which broadcasts a
        "<table>_change" event each time a table of the collector changes. The client
        connects to `/realtime/<group>/<token>` on the messenger. When the messenger
        requires tokens, only those registered here are let in: only signed-in users
        listen. The token is single use: a new one is asked for each connection.
        Answers 503 when no messenger is configured or reachable.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [token, group]
                    properties:
                      token:
                        type: string
                      group:
                        type: string
                        description: The messenger group the change events are published to.
        401:
          $ref: '#/components/responses/401'
        500:
          $ref: '#/components/responses/500'
        503:
          $ref: '#/components/responses/503'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /clusters:
    get:
      operationId: GetClusters
      description: |
        List the clusters the collector knows from their daemon status, with their
        counts of nodes and services. A manager sees every cluster; the others see the
