        - $ref: '#/components/parameters/inQueryFilter'
        - $ref: '#/components/parameters/inQueryGroupby'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    post:
      operationId: PostOrchestration
      description: |
        Create an orchestration: an ordered list of steps, each one agent action on a
        set of targets. The steps are checked as a whole (see OrchestrationStep):
        400 names the first one that is not valid. 409 when the name is taken.
        Manager only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchestrationInput'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orchestration'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /orchestrations/check:
    post:
      operationId: PostOrchestrationCheck
      description: |
        Resolve the targets of each step of an orchestration, saved or not, as a run
        starting now would, and check each one as the action queue would: the
        action is accepted for the kind of target, the target exists and an agent
        can be reached for it. What the check finds is not stored. Manager only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchestrationInput'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationCheckResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /orchestrations/{orchestration_id}:
    parameters:
      - $ref: '#/components/parameters/inPathOrchestrationId'
    get:
      operationId: GetOrchestration
      description: An orchestration and its steps. Manager only.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orchestration'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    put:
      operationId: PutOrchestration
      description: |
        Replace an orchestration, its name, description and steps, checked as on
        creation. Its past and running runs keep the plan they started with.
        Manager only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchestrationInput'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orchestration'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    delete:
      operationId: DeleteOrchestration
      description: |
        Delete an orchestration. Its runs stay, with the plan they ran; a running run
        goes on. Manager only.
      tags:
        - collector
      responses:
        200:
          $ref: '#/components/responses/200'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /orchestrations/{orchestration_id}/runs:
    parameters:
      - $ref: '#/components/parameters/inPathOrchestrationId'
    post:
      operationId: PostOrchestrationRun
      description: |
        Start a run of the orchestration: its steps are frozen in the run, the
        filtersets resolved now, and the first step starts at once. The steps
        then run one after the other, the next starting when every target of
        the previous one succeeded. A target fails when its action returns
        non-zero, is refused by the action queue, is cancelled or outlives the
        time limit of its step; the run then stops: the targets not started and
        the next steps do not run. 400 when a step matches no target. Manager
        only.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationRun'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /orchestration_runs:
    get:
      operationId: GetOrchestrationRuns
      description: |
        The runs of the orchestrations, the latest first unless sorted otherwise,
        as a collector list: props, filters, sort, pagination and stats. Each with
        the count of its steps and of those done, and its duration; the runs of
        one orchestration with the filter orchestration_id:eq:<id>. The steps and
        targets of a run are read by GET /orchestration_runs/{run_id}. Manager
        only.
      parameters:
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
        - $ref: '#/components/parameters/inQueryStats'
        - $ref: '#/components/parameters/inQueryOrderby'
        - $ref: '#/components/parameters/inQueryFilter'
        - $ref: '#/components/parameters/inQueryGroupby'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationRunListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /orchestration_runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/inPathOrchestrationRunId'
    get:
      operationId: GetOrchestrationRun
      description: |
        A run, its steps and the targets of each step, with the status, the
        return code and the output of the action of each target. Manager only.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationRun'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /orchestration_runs/{run_id}/stop:
    parameters:
      - $ref: '#/components/parameters/inPathOrchestrationRunId'
    post:
      operationId: PostOrchestrationRunStop
      description: |
        Stop a running run: the targets not started yet do not run, nor the next
        steps, and the actions still waiting in the queue are cancelled. An action
        an agent already runs cannot be interrupted: it goes on and its result is
        recorded. 409 when the run is not running. Manager only.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationRun'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /orchestration_runs/{run_id}/continue:
    parameters:
      - $ref: '#/components/parameters/inPathOrchestrationRunId'
    post:
      operationId: PostOrchestrationRunContinue
      description: |
        Acknowledge the failed or stopped step of a failed or stopped run and
        go on with the next step: the step becomes acknowledged, with the comment, which is
        required, the author and the date; its targets keep their outcome. The
        next steps run with the targets resolved when the run started; when the
        failed step was the last, the run ends as succeeded. 400 without a
        comment; 409 when the run is neither failed nor stopped, or an action of
        it still runs.
        Manager only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchestrationRunContinueInput'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationRun'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /orchestration_runs/{run_id}/resume:
    parameters:
      - $ref: '#/components/parameters/inPathOrchestrationRunId'
    post:
      operationId: PostOrchestrationRunResume
      description: |
        Resume a failed or stopped run from the step it stopped at: the targets of
        that step that did not succeed run again, then the next steps, with the
        targets resolved when the run started. 409 when the run is not failed or
        stopped, or an action of it still runs. Manager only.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationRun'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /nodes/delete:
    post:
      operationId: PostNodesDelete
      description: |
        Delete nodes by id or name, up to 1000, each as DELETE /nodes/{node_id}
        does: its checks (responsibility for the node), its transaction, its
        cascade and its audit entry; a refusal does not stop the others. One change
        event for the batch. Requires the NodeManager privilege.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdsInput'
      tags:
        - collector
      responses:
        200:
          description: The outcome of each object, in the order sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /services/delete:
    post:
      operationId: PostServicesDelete
      description: |
        Delete services by id or name, up to 1000, each as DELETE /services/{svc_id}
        does: responsibility for the service, its transaction, its cascade on the
        instances and alerts and its audit entry; a refusal does not stop the
        others. One change event for the batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdsInput'
      tags:
        - collector
      responses:
        200:
          description: The outcome of each object, in the order sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /services_instances/delete:
    post:
      operationId: PostServicesInstancesDelete
      description: |
        Delete service instances, up to 1000, each as
        DELETE /services/{svc_id}/instances/{node_id} does: responsibility for the
        service, its transaction and its audit entry; a refusal does not stop the
        others. The id of an outcome is "svc_id@node_id". One change event for the
        batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstancesInput'
      tags:
        - collector
      responses:
        200:
          description: The outcome of each object, in the order sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /services_actions/ack:
    post:
      operationId: PostServicesActionsAck
      description: |
        Acknowledge failed agent actions, up to 1000, each as
        POST /services_actions/{action_id} does (responsibility for the service, an
        action not failed or acknowledged already skipped, its audit entry), with
        the same comment. The unacknowledged errors of each instance concerned and
        its "action errors" alert are counted once for the batch, and one change
        event sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionsAckInput'
      tags:
        - collector
      responses:
        200:
          description: The outcome of each object, in the order sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /checks/live/batch:
    post:
      operationId: PostChecksLiveBatch
      description: |
        Apply one change to checks by id, up to 1000: set_thresholds sets
        chk_low and chk_high (a bound not given keeps the one the check has),
        reset_thresholds removes the thresholds set on them, delete deletes them,
        each as its single route does (responsibility for the node, its audit
        entry). The checks of each node concerned are refreshed once for the batch,
        and one change event sent. Requires the CheckExec privilege.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecksBatchInput'
      tags:
        - collector
      responses:
        200:
          description: The outcome of each object, in the order sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

components:

  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '204':
      description: No Content
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '408':
      description: Request Timeout
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '409':
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '413':
      description: Content Too Large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    '503':
      description: Service Unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    AuthInfo:
      type: object
      required: [basic, oidc, session]
      properties:
        basic:
          type: boolean
          description: |
            Whether users may sign in with their collector password
            (server.auth.basic_users). When false, the collector also refuses to set
            passwords, at user creation and on the profile.
        oidc:
          type: object
          required: [enabled, ready, name, issuer, client_id]
          properties:
            enabled:
              type: boolean
            ready:
              type: boolean
              description: Whether the provider was discovered and the sign-in can start
            name:
              type: string
              description: Name of the provider (display_name), for messages and logs; the sign-in screen does not show it
            issuer:
              type: string
              description: |
                Issuer identifier of the provider (server.auth.oidc.issuer), as its
                discovery document gives it; empty when OpenID Connect is disabled.
            client_id:
              type: string
              description: |
                Client id of the collector at the provider (server.auth.oidc.client_id),
                the one its sign-in uses; empty when OpenID Connect is disabled. The
                client is confidential: its secret stays on the server.
        session:
          type: boolean
          description: Whether the request carries a valid OpenID Connect session

    ListMeta:
      type: object
      required:
      properties:
        count:
          type: integer
        available_props:
          type: array
          items:
            type: string
        included_props:
          type: array
          items:
            type: string
        limit:
          type: integer
        offset:
          type: integer
        distinct:
          type: object
          description: With stats, the number of distinct values of each property.
          additionalProperties:
            type: integer
        other:
          type: object
          description: |
            With stats and a limit, the number of rows of each property whose value
            is not among those returned.
          additionalProperties:
            type: integer
        total:
          type: integer
          description: |
            Number of rows of the list without pagination, the filters applied; for
            a grouped list, the number of groups. With stats, the number of rows the
            statistics are computed from.

    NodeRow:
      type: object
      description: |
        A node row of the nodes list. Every property is optional: the `props`
        query parameter selects which columns the server returns, so a row
        carries only the requested subset.
      properties:
        node_id:
          type: string
        nodename:
          type: string
        app:
          type: string
        node_env:
          type: string
        cluster_id:
          type: string
        clusters.cluster_name:
          type: string
          nullable: true
          description: Name of the node's cluster, from the joined clusters table.
        loc_country:
          type: string
        loc_city:
          type: string
        loc_addr:
          type: string
        loc_building:
          type: string
        loc_floor:
          type: string
        loc_room:
          type: string
        loc_rack:
          type: string
        loc_zip:
          type: string
        cpu_freq:
          type: string
        cpu_cores:
          type: integer
        cpu_dies:
          type: integer
        cpu_vendor:
          type: string
        cpu_model:
          type: string
        cpu_threads:
          type: integer
        mem_banks:
          type: integer
        mem_slots:
          type: integer
        mem_bytes:
          type: integer
        os_name:
          type: string
        os_release:
          type: string
        os_update:
          type: string
        os_segment:
          type: string
        os_arch:
          type: string
        os_vendor:
          type: string
        os_kernel:
          type: string
        os_concat:
          type: string
        team_responsible:
          type: string
        team_integ:
          type: string
        team_support:
          type: string
        serial:
          type: string
        model:
          type: string
        manufacturer:
          type: string
        type:
          type: string
        assetname:
          type: string
        asset_env:
          type: string
        warranty_end:
          type: string
        maintenance_end:
          type: string
        status:
          type: string
        role:
          type: string
        sec_zone:
          type: string
        power_cabinet1:
          type: string
        power_cabinet2:
          type: string
        power_supply_nb:
          type: integer
        power_protect:
          type: string
        power_protect_breaker:
          type: string
        power_breaker1:
          type: string
        power_breaker2:
          type: string
        blade_cabinet:
          type: string
        enclosure:
          type: string
        enclosureslot:
          type: string
        hv:
          type: string
        hvpool:
          type: string
        hvvdc:
          type: string
        fqdn:
          type: string
        connect_to:
          type: string
        listener_port:
          type: integer
        version:
          type: string
        collector:
          type: string
        sp_version:
          type: string
        bios_version:
          type: string
        tz:
          type: string
        last_boot:
          type: string
        last_comm:
          type: string
        node_frozen:
          type: string
        node_frozen_at:
          type: string
        snooze_till:
          type: string
        notifications:
          type: string
        action_type:
          type: string
        hw_obs_warn_date:
          type: string
        hw_obs_alert_date:
          type: string
        os_obs_warn_date:
          type: string
        os_obs_alert_date:
          type: string
        updated:
          type: string

    NodeListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/NodeRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    ServiceRow:
      type: object
      description: |
        A service row of the services list. Every property is optional: the `props`
        query parameter selects which columns the server returns, so a row
        carries only the requested subset.
      properties:
        svc_sla:
          type: number
          format: double
          nullable: true
          description: The availability target, in percent; null without SLA.
        svc_availability:
          type: number
          format: double
          nullable: true
          description: |
            The availability rate of the last 30 days, in percent, as the status
            history of the service computes it, stored by the scheduler every 10
            minutes and at once when a justification changes; sortable and
            filterable. Null without status recorded.
        svc_availability_trend:
          type: number
          format: double
          nullable: true
          description: |
            The change of svc_availability over the last 7 days, in points: its
            value now minus its value 7 days ago, positive when the service is
            more available than it was. Null without status history 7 days ago.
        svc_availability_updated:
          type: string
          nullable: true
          description: When svc_availability was computed.
        id:
          type: integer
        svc_id:
          type: string
        svcname:
          type: string
        cluster_id:
          type: string
        svc_status:
          type: string
