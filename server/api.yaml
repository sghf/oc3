      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceLogListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /compliance/status:
    get:
      operationId: GetComplianceStatus
      description: |
        List the last check run of each module-node-service tuple, for the nodes the
        user can see: those whose app is published to one of the user's groups, every
