  /forms/{form_id}:
    get:
      operationId: GetForm
      description: |
        Show a form, as GET /forms restricted to one id: empty when the form does
        not exist or is not published to the caller.
      parameters:
        - in: path
          name: form_id
          required: true
          description: Form id
          schema:
            type: integer
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
