        blade_cabinet:
          type: string
        enclosure:
          type: string
        enclosureslot:
          type: string
        hv:
          type: string
        hvpool:
          type: string
        hvvdc:
          type: string
        fqdn:
          type: string
        connect_to:
          type: string
        listener_port:
          type: integer
        version:
          type: string
        collector:
          type: string
        sp_version:
          type: string
        bios_version:
          type: string
        tz:
          type: string
        last_boot:
          type: string
        last_comm:
          type: string
        node_frozen:
          type: string
        node_frozen_at:
          type: string
        snooze_till:
          type: string
        notifications:
          type: string
        action_type:
          type: string
