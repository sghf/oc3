        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

    post:
      operationId: PostCharts
      description: |
        Create a chart. Its name must be unique, and its definition, when given,
        must be valid YAML. The chart is published to the primary team of its author,
        which is also made responsible for it, as in the historical collector.
        Requires the ReportsManager or Manager privilege, as for the reports.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chart_name
              properties:
                chart_name:
                  type: string
                  description: Unique name of the chart.
                chart_yaml:
                  type: string
                  description: Definition of the chart, in YAML.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
