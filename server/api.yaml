          type: string
        cluster_id:
          type: string
        svc_status:
          type: string
        svc_availstatus:
          type: string
        svc_app:
          type: string
        svc_env:
          type: string
        svc_ha:
          type: integer
        svc_topology:
          type: string
        svc_frozen:
          type: string
        svc_placement:
          type: string
