          nullable: true
        chk_high:
          type: integer
          format: int64
          nullable: true
        chk_err:
          type: integer
          nullable: true
        chk_threshold_provider:
          type: string
          description: Where the thresholds come from, settings, fset:<filterset> or defaults.
        chk_created:
          type: string
        chk_updated:
          type: string
        services.svcname:
          type: string
          nullable: true
        nodes.nodename:
