  /services/{svc_id}/status_log:
    get:
      operationId: GetServiceStatusLog
      description: |
        The availability of a service over the last days, as periods of one status:
        the closed ones of services_log and the current one of services_log_last,
        oldest first, with their justification when they have one. The availability
        rate of the period follows, as the historical service availability computes
        it: the time up or standby up over the time counted, from the start of the
        history when that is later; the time no status covers is downtime, and the
        justified downtime marked not to account is left out of the count. The
        service must be visible to the caller.
      parameters:
        - in: path
          name: svc_id
          required: true
          description: Service id or name
          schema:
            type: string
        - in: query
          name: days
          description: The days of history to return, 7 by default, 365 at most.
          schema:
            type: integer
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, availability]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceStatusPeriod'
                  availability:
                    $ref: '#/components/schemas/ServiceAvailability'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /services/{svc_id}/status_log/ack:
    put:
      operationId: PutServiceStatusLogAck
      description: |
        Justify a period of the availability of a service, or change its
        justification: a comment, and whether the period still counts in the
        availability rate. The period is named by its bounds, as the status log
        gives them. Requires the responsibility of the service. The change is
        logged.
      parameters:
        - in: path
          name: svc_id
          required: true
          description: Service id or name
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [begin, end, comment, account]
              properties:
                begin:
                  type: string
                end:
                  type: string
                comment:
                  type: string
                account:
                  type: boolean
                  description: False to leave the period out of the availability rate.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  info:
                    type: string
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    delete:
      operationId: DeleteServiceStatusLogAck
      description: |
