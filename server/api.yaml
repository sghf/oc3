  /search:
    get:
      operationId: GetSearch
      description: |
        Search the main kinds of objects for the text, as the historical collector's
        search: nodes, services, instances, applications, node addresses, disks, tags,
        users, organizational groups (group), privilege groups (privilege), requests,
        modulesets, rulesets, filtersets and forms. For each
        kind, the objects whose name or another identifying prop contains the text,
        case-insensitively, are read through the kind's own list and its access
        control. A request also matches by its number. Then come, while `limit` leaves
        room, the objects whose context contains the text: the props returned beside
        the name to tell homonyms apart, such as the application, the environment and
        the operating system of a node, the node of an instance, of an address or of
        a disk, or the author of a moduleset. Groups come in that order, one
        per kind, with `more` set when other objects match beyond `limit`. A kind that
        cannot be searched reports it in its `error` without failing the others. A
        text shorter than 2 characters returns no group.
      parameters:
        - in: query
          name: q
          required: true
          description: The text to search for.
          schema:
            type: string
        - in: query
          name: kinds
          description: |
            Comma-separated kinds to search, all by default: node, service, instance,
            app, network, disk, tag, user, group, privilege, request, moduleset,
            ruleset, filterset, form.
          schema:
            type: string
        - in: query
          name: limit
          description: Hits returned per kind, 5 by default, 20 at most.
          schema:
            type: integer
            minimum: 1
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /networks:
    get:
      operationId: GetNetworks
      description: |
        List the declared networks, by name then address. Every authenticated user
        may read them. `begin`, `end` and `broadcast` are computed from `network` and
        `netmask`.
      parameters:
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
