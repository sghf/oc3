    get:
      operationId: GetSafeFiles
      description: |
        List the files of the collector safe the caller may see: a Manager every
        file; a user those they uploaded or published to one of their groups; a
        node those published to its responsible team. Each version of a file is a
        row. `md5`, `sha256` and `size` are those of the plaintext; `encrypted`
        tells whether the file is encrypted at rest.
      parameters:
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
        - $ref: '#/components/parameters/inQueryStats'
