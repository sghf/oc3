    post:
      operationId: PostSafeUpload
      description: |
        Upload a new file into the safe. Requires the SafeUploader privilege,
        except for a node. The file is encrypted at rest when the collector is
        configured to (safe.encryption, safe.keys_file), stored in plaintext
        otherwise, and published to and made the responsibility of the caller's
        default group. Logged.
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The content of the file.
                name:
                  type: string
                  description: A name to tell the file by, the name of the uploaded file by default.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
