        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldConstraintRowListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /field_constraints/{object_kind}:
    get:
      operationId: GetFieldConstraints
      description: |
        The attributes of the kind of object whose values are constrained, one
        entry each: suggest (the list is offered, another value is accepted),
        strict (the api refuses any other value set by a user, except clearing the
        attribute or keeping the value it holds) or regex (the value set by a user
        must match the whole pattern, with the same exceptions). An attribute
        absent from data is
        free text, the default. fields lists the attributes that may be
        constrained. The writes of the nodes themselves are not checked: they
        report what the node has. Any signed-in user may read them, to fill the
        dropdowns.
      parameters:
        - in: path
          name: object_kind
          required: true
          schema:
            $ref: '#/components/schemas/FieldConstraintObjectKind'
      tags:
        - nodes
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldConstraintListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /field_constraints/{object_kind}/{field}:
    post:
      operationId: PostFieldConstraint
      description: |
        Set the mode and the values allowed for an attribute, creating its
        constraint or replacing it as a whole. Modes suggest and strict take
        values: trimmed, empty ones and duplicates dropped, order kept. Mode regex
        takes a pattern, in RE2 syntax, which the whole value must match (as if
        written ^(?:pattern)$): 400 when it does not compile. The values the
        objects already hold are not changed, even when they do not comply.
        Manager only.
      parameters:
        - in: path
          name: object_kind
          required: true
          schema:
            $ref: '#/components/schemas/FieldConstraintObjectKind'
        - in: path
          name: field
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldConstraintInput'
      tags:
        - nodes
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldConstraintListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

    delete:
      operationId: DeleteFieldConstraint
      description: |
        Remove the constraint of an attribute, which becomes free text again, the
        default. The values the objects hold are not changed. 404 when the
        attribute cannot be constrained or has no constraint. Manager only.
      parameters:
        - in: path
          name: object_kind
          required: true
          schema:
            $ref: '#/components/schemas/FieldConstraintObjectKind'
        - in: path
          name: field
          required: true
          schema:
            type: string
      tags:
        - nodes
      responses:
        200:
          $ref: '#/components/responses/200'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

