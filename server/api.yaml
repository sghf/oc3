  /nodes/{node_id}/sysreport:
    get:
      operationId: GetNodeSysreport
      description: |
        List the changes of the files and command outputs the node reports
        (sysreport), newest first, as the historical collector's timeline: one entry
        per report that changed something, with the files it changed and their added
        and deleted line counts. Requires responsibility for the node. A node that
        never reported has no change.
      parameters:
        - in: path
          name: node_id
          required: true
          description: Node identifier (node_id UUID)
          schema:
            type: string
        - in: query
          name: path
          description: Keep the files whose path or command line contains this text, and the changes touching one.
          schema:
            type: string
        - in: query
          name: begin
          description: Keep the changes made since this date, for example 2026-09-01 or 2026-09-01T10:00:00.
          schema:
            type: string
        - in: query
          name: end
          description: Keep the changes made until this date.
          schema:
            type: string
        - in: query
          name: limit
          description: The maximum number of changes to return, 50 by default. 0 means no limit.
          schema:
            type: integer
            minimum: 0
        - in: query
          name: offset
          description: Skip the first changes.
          schema:
            type: integer
            minimum: 0
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysreportTimelineResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /nodes/{node_id}/sysreport/purge:
    post:
      operationId: PostNodeSysreportPurge
      description: |
        Remove files from the sysreport history for good, of this node or, with
        all_nodes, of every node having a sysreport: each revision is recreated
        without them, its date and author kept, a revision that held nothing else
        is dropped, then the former revisions and the contents they alone held are
        destroyed. The ids of the revisions change from the first one that held a
        file. A file is named as the sysreport routes show it, by kind and path or
        command line. The purge is queued for the scheduler: the response gives
        its id, GET /sysreport/purges/{purge_id} its progress. It does not stop a
        node from reporting the files again. Manager only; logged.
      parameters:
        - in: path
          name: node_id
          required: true
          description: Node identifier (node_id UUID)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysreportPurgeInput'
      tags:
        - nodes
      responses:
        202:
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysreportPurgeResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /nodes/{node_id}/sysreport/timediff:
    get:
      operationId: GetNodeSysreportTimediff
      description: |
        Show what changed in each file between two states of the node's sysreport, as
        one unified diff per file. Each state is given as a date, which designates the
        last report made at or before it, or as a revision of the timeline; the end
        defaults to the latest report. A begin older than the first report compares
        with nothing reported: every file is then added. Sensitive paths are withheld
        as in a change.
      parameters:
        - in: path
          name: node_id
          required: true
          description: Node identifier (node_id UUID)
          schema:
            type: string
        - in: query
          name: begin
          required: true
          description: The state compared from, a date (2026-09-01T10:00:00Z) or a revision.
          schema:
            type: string
        - in: query
          name: end
          description: The state compared to, a date or a revision; the latest report by default.
          schema:
            type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysreportTimediffResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /nodes/{node_id}/sysreport/{cid}:
    get:
      operationId: GetNodeSysreportChange
      description: |
        Show the change a report made to each file, as a unified diff starting at its
        first hunk. The paths matching a secure pattern are sensitive: their diff is
        given only to managers, to the node's responsible team and to the groups an
        authorization names for the path and a filterset holding the node; for the
        others the file is listed with `restricted` set and no diff. Without any secure
        pattern every path is sensitive.
      parameters:
        - in: path
          name: node_id
          required: true
          description: Node identifier (node_id UUID)
          schema:
            type: string
        - in: path
          name: cid
          required: true
          description: Revision of the sysreport, a commit id of the timeline or HEAD for the latest.
          schema:
            type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SysreportChangeResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /nodes/{node_id}/sysreport/{cid}/tree:
