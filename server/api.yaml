        - basicAuth: [ ]
        - bearerAuth: [ ]

  /compliance/rulesets:
    get:
      operationId: GetComplianceRulesets
      description: |
        List the rulesets published to one of the user's groups, every ruleset for a
        manager.
      parameters:
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
        - $ref: '#/components/parameters/inQueryStats'
        - $ref: '#/components/parameters/inQueryOrderby'
        - $ref: '#/components/parameters/inQueryFilter'
        - $ref: '#/components/parameters/inQueryGroupby'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesetListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    post:
      operationId: PostComplianceRulesets
      description: |
        Create a ruleset named ruleset_name, of type explicit and public unless given,
        published to and under the responsibility of the user's default group (the
        Manager group without one). When a ruleset of that name exists, its other given
        properties are updated instead, as POST /compliance/rulesets/{rset_id}.
        Requires the CompManager privilege. The change is logged and the ruleset chains
        are rebuilt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ruleset_name:
                  type: string
                ruleset_type:
                  type: string
                  enum: [explicit, contextual]
                ruleset_public:
                  description: A boolean, or "T" / "F" as stored.
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesetListResponse'
        400:
          $ref: '#/components/responses/400'
