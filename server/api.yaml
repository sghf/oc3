        - basicAuth: [ ]
        - bearerAuth: [ ]
    post:
      operationId: PostForm
      description: |
        Modify a form. The keys are forms columns; form_definition, a JSON document
        or its string form, is stored as form_yaml. A new form_yaml is recorded in
        the form's revision history. Requires the FormsManager privilege.
      parameters:
        - in: path
          name: form_id
          required: true
          description: Form id
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
                type: object
                additionalProperties: true
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormListResponse'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    put:
      operationId: PutForm
      description: |
        Submit a form: validate the data against the form inputs and run its
        outputs (db, rest, script, mail, workflow). The body may also be
        form-encoded, data given as its JSON string, as in the historical examples. The answer is the results
        structure, also stored and readable with GET /form_output_results/{id}. A
        negative id designates an internal form. The form must be published to the
        caller, unless a manager.

        A submission continuing a request (`prev_wfid`, a form with a workflow
        output) decides on that step: the form must be one of the next forms the
        step names (the `NextForms` of its workflow output, those of its `Scripts`
        outcomes included), and the caller its assignee, by full name or through
        one of their groups, a manager included; 403 otherwise, 404 when the step
        does not exist.
      parameters:
        - in: path
          name: form_id
          required: true
          description: Form id
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
                type: object
                properties:
                  data:
                    description: The information the form expects, as an object, a list of objects or their JSON string form.
                  prev_wfid:
                    description: The id of the step of an existing workflow this submission decides on (forms_store.id).
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    delete:
      operationId: DeleteForm
      description: |
        Delete a form, with its publications and responsibles. Requires the
        FormsManager privilege and responsibility for the form.
      parameters:
        - in: path
          name: form_id
          required: true
          description: Form id
          schema:
