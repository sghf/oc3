        returns. The `services.` and `nodes.` props come from joined tables.
      properties:
        id:
          type: integer
        svc_id:
          type: string
        node_id:
          type: string
        sid:
          type: string
          nullable: true
          description: Session id, shared by the actions of one agent command
        pid:
          type: string
          nullable: true
        rid:
          type: string
          nullable: true
        subset:
          type: string
          nullable: true
        action:
          type: string
          nullable: true
        command:
          type: string
          nullable: true
        origin:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
          description: ok, warn, err, or empty while the action runs
        begin:
          type: string
        end:
          type: string
          nullable: true
        time:
          type: integer
          nullable: true
          description: Duration, in seconds
        status_log:
          type: string
          nullable: true
        log_type:
          type: string
          nullable: true
          description: '"status" for an action, empty for a log line of an action'
        cron:
          type: integer
          nullable: true
          description: 1 when the scheduler of the agent ran the action
        version:
          type: string
          nullable: true
        hostid:
          type: string
          nullable: true
        alert:
          type: integer
          nullable: true
        ack:
          type: integer
          nullable: true
        acked_by:
          type: string
          nullable: true
        acked_date:
          type: string
          nullable: true
        acked_comment:
          type: string
          nullable: true
        services.svcname:
          type: string
        nodes.nodename:
          type: string
          nullable: true

    ServiceActionListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ServiceActionRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    ResourceListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ResourceRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    ClusterRow:
      type: object
      description: |
        A cluster, as its daemon last pushed its status. Every property is optional:
        the `props` query parameter selects which columns the server returns.
      properties:
        id:
          type: integer
        cluster_id:
          type: string
        cluster_name:
          type: string
        node_count:
          type: integer
          description: Nodes of the collector naming the cluster.
        svc_count:
          type: integer
          description: Services of the collector naming the cluster.
        agent_versions:
          type: string
          description: Agent versions of its nodes, distinct, comma-separated.
        cluster_nodes:
          type: string
          description: Node names of the cluster configuration, comma-separated.
        quorum:
          type: integer
          description: 1 when the cluster configuration requires a quorum.
        frozen:
          type: integer
          description: 1 when the cluster is frozen.
        compat:
          type: integer
          description: 1 when the daemons of its nodes are compatible.
        listener_port:
          type: integer
        cluster_updated:
          type: string
          description: When the daemon status was produced, RFC 3339.

    ClusterListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ClusterRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    ReportRow:
      type: object
      description: |
        A report: a page of charts and metrics, defined in YAML. Every property is
        optional: the `props` query parameter selects which columns the server
        returns.
      properties:
        id:
          type: integer
        report_name:
          type: string
        report_yaml:
          type: string

    ReportListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ReportRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    ChartRow:
      type: object
      description: |
        A chart: time series of historized metrics, defined in YAML. Every property is
        optional: the `props` query parameter selects which columns the server
        returns.
      properties:
        id:
          type: integer
        chart_name:
          type: string
        chart_yaml:
          type: string

    ChartSeries:
      type: object
      required:
        - metric_id
        - points
      properties:
        metric_id:
          type: integer
        label:
          type: string
          description: The label the chart definition gives the metric.
        unit:
          type: string
        instance:
          type: string
          nullable: true
          description: The instance of the metric, null for a metric without instances.
        points:
          type: array
          description: The points, oldest first, each [unix time, value].
          items:
            type: array
            items:
              type: number
              format: double

    ChartSamples:
      type: object
      required:
        - stack
        - series
      properties:
        stack:
          type: boolean
        series:
          type: array
          items:
            $ref: '#/components/schemas/ChartSeries'

    ChartSamplesResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ChartSamples'

    NodeStatSeries:
      type: object
      required:
        - metric
        - points
      properties:
        metric:
          type: string
          description: The metric, as the agent names it (usr, pct_memused, rxkBps...).
        device:
          type: string
          description: The network interface or block device, for the groups by device.
        points:
          type: array
          description: The points, oldest first, each [unix time, value].
          items:
            type: array
            items:
              type: number
              format: double

    NodeStatsResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NodeStatSeries'

    ChartListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ChartRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    FilterRow:
      type: object
      description: |
        A filter: one condition on a column of a collector table, which filtersets
        combine. Every property is optional: the `props` query parameter selects which
        columns the server returns. `f_label` and `f_cksum` are computed by the
        database from the definition.
      properties:
        id:
          type: integer
        f_table:
          type: string
        f_field:
          type: string
        f_op:
          type: string
        f_value:
          type: string
          nullable: true
        f_label:
          type: string
        f_cksum:
          type: string
        f_author:
          type: string
        f_updated:
          type: string

    FormRow:
      type: object
      description: |
        A form: its definition, form_yaml, drives the inputs a submission expects
        and the outputs it runs. form_definition is form_yaml parsed. Every
        property is optional: the `props` query parameter selects which columns
        the server returns.
      properties:
        id:
          type: integer
        form_name:
          type: string
        form_yaml:
          type: string
        form_definition:
          nullable: true
          description: form_yaml parsed, absent when it does not parse
        form_author:
          type: string
        form_created:
          type: string
        form_type:
          type: string
          description: obj, custo, folder or generic
        form_folder:
          type: string

    FormListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/FormRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'
        info:
          type: string
          description: The change made, on a modification

    FilterListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/FilterRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    OidcMappingRow:
      type: object
      description: |
        A rule translating a claim value into access and a team. Every property is
        optional: the props query parameter selects which columns the server returns.
      properties:
        id:
          type: integer
        claim:
          type: string
          description: Claim name, or dotted path into a nested claim
        value:
          type: string
          description: Value the claim must equal, or contain for a list
        allow_access:
          type: string
          description: T when the matching identities may sign in, F otherwise
        group_ids:
          type: string
          description: Ids of the teams granted to the matching identities, comma separated, in the order of their names; empty when the rule grants none
        group_roles:
          type: string
          description: Names of those teams, comma and space separated
        privilege_ids:
          type: string
          description: Ids of the privilege teams among them, comma separated, in the order of their names
        privilege_roles:
          type: string
          description: Names of the privilege teams among them, comma and space separated
        org_ids:
          type: string
          description: Ids of the organizational teams among them, comma separated, in the order of their names
        org_roles:
          type: string
          description: Names of the organizational teams among them, comma and space separated
        author:
          type: string
        updated:
          type: string

    ComplianceVersion:
      type: object
      description: A version of the compliance export, a commit of its git repository.
      required:
        - id
        - date
        - author
        - subject
        - body
        - source
      properties:
        id:
          type: string
          description: The commit id.
        date:
          type: string
          description: The date of the commit, ISO 8601.
        author:
          type: string
          description: '"First Last <email>" of the user who committed.'
        subject:
          type: string
          description: The first line of the message.
        body:
          type: string
          description: The rest of the message, the changes saved, one per line.
        source:
          type: string
          enum: [designer, elsewhere, ""]
          description: What the version records, as given when it was recorded; empty when not said.

    ComplianceExport:
      type: object
      description: The compliance export a version recorded, in the format of the import.
      required:
        - filtersets
        - rulesets
        - modulesets
      properties:
        filtersets:
          type: array
          items:
            $ref: '#/components/schemas/FiltersetExportItem'
        rulesets:
          type: array
          items:
            $ref: '#/components/schemas/CompExportRuleset'
        modulesets:
          type: array
          items:
            $ref: '#/components/schemas/CompExportModuleset'

    ComplianceVersionDetail:
      type: object
      required:
        - version
        - export
        - diff
      properties:
        version:
          $ref: '#/components/schemas/ComplianceVersion'
        export:
          $ref: '#/components/schemas/ComplianceExport'
        previous:
          description: The export of the version before, absent for the first one.
          allOf:
            - $ref: '#/components/schemas/ComplianceExport'
        previous_id:
          type: string
          description: The commit id of the version before, absent for the first one.
        diff:
          type: string
          description: The git diff of the export from the version before, unified.

    OidcMappingListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/OidcMappingRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    OidcMappingInput:
      type: object
      required: [claim, value]
      properties:
        claim:
          type: string
        value:
          type: string
        allow_access:
          type: boolean
        group_ids:
          type: array
          description: The teams the rule grants, as many as needed
          items:
            type: integer

    FieldConstraintObjectKind:
      type: string
      description: |
        The kind of object whose attributes are constrained, and so the detail
        panel and the table they belong to: node (nodes), service (services), app
        (apps).
      enum: [node, service, app]

    FieldConstraintMode:
      type: string
      description: |
        suggest: the values are offered, another one is accepted; strict: a user
        may only set one of the values, clear the attribute or keep the value it
        holds; regex: a user may only set a value matching the whole pattern, clear
        the attribute or keep the value it holds. An attribute without a
        constraint is free text.
      enum: [suggest, strict, regex]
      x-enum-varnames: [FieldConstraintModeSuggest, FieldConstraintModeStrict, FieldConstraintModeRegex]

    FieldConstraint:
      type: object
      required: [object_kind, field, mode, values, pattern, updated, updated_by]
      properties:
        object_kind:
          $ref: '#/components/schemas/FieldConstraintObjectKind'
        field:
          type: string
        mode:
          $ref: '#/components/schemas/FieldConstraintMode'
        values:
          type: array
          description: The allowed values, in display order; empty in mode regex
          items:
            type: string
        pattern:
          type: string
          description: In mode regex, the RE2 pattern the whole value must match; empty otherwise
        updated:
          type: string
          description: Date of the last change
        updated_by:
          type: string
          description: Email of the author of the last change

    FieldConstraintListResponse:
      type: object
      required: [data, fields]
      properties:
        data:
          type: array
          description: The constrained attributes; the others are free text
          items:
            $ref: '#/components/schemas/FieldConstraint'
        fields:
          type: array
          description: The attributes of the kind of object that may be constrained, in display order
          items:
            type: string

    FieldConstraintRow:
      type: object
      description: |
        A constraint, as a row of the list. Every property is optional: the props
        query parameter selects which columns the server returns.
      properties:
        object_kind:
          type: string
        field:
          type: string
        mode:
          type: string
          description: suggest, strict or regex
        values:
          type: string
          description: The allowed values, a JSON array of strings in display order; [] in mode regex
        value_count:
          type: integer
          description: The number of allowed values; 0 in mode regex
        pattern:
          type: string
          description: In mode regex, the pattern; empty otherwise
        allowed:
          type: string
          description: |
            What is allowed, as text for filtering and sorting: the pattern in mode
            regex, the values separated by ", " otherwise.
        updated:
          type: string
        updated_by:
          type: string

    FieldConstraintRowListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/FieldConstraintRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    FieldConstraintInput:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/FieldConstraintMode'
        values:
          type: array
          description: |
            Modes suggest and strict: at least one value, at most 2000, each up to
            255 characters. Ignored in mode regex.
          items:
            type: string
        pattern:
          type: string
          description: |
            Mode regex: the RE2 pattern the whole value must match, up to 1024
            characters. Ignored in the other modes.

    FiltersetRow:
      type: object
      description: |
        A filterset: an ordered combination of filters and other filtersets that
        selects nodes and services. Every property is optional: the `props` query
        parameter selects which columns the server returns.
      properties:
        id:
          type: integer
        fset_name:
          type: string
        fset_stats:
          type: string
          description: T for a stats filterset, F otherwise.
        fset_author:
          type: string
        fset_updated:
          type: string

    FiltersetListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/FiltersetRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    FiltersetFilterRow:
      type: object
      description: |
        A filter attached to a filterset: the filter properties, plus its position
        (`f_order`) and the logical operator joining it to the previous entry.
      properties:
        id:
          type: integer
        f_table:
          type: string
        f_field:
          type: string
        f_op:
          type: string
        f_value:
          type: string
          nullable: true
        f_label:
          type: string
        f_cksum:
          type: string
        f_author:
          type: string
        f_updated:
          type: string
        f_log_op:
          type: string
        f_order:
          type: integer
        fset_id:
          type: integer
        encap_fset_id:
          type: integer
          nullable: true
        join_id:
          type: integer

    FiltersetFilterListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/FiltersetFilterRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    FiltersetUsageResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: |
            What uses a filterset, all of it removed with the filterset when it is
            deleted. The teams responsible for the filterset itself are not uses.
          required: [filtersets, rulesets, thresholds, users, comparisons, sysreport_grants]
          properties:
            filtersets:
              type: array
              description: Filtersets nesting this one.
              items:
                $ref: '#/components/schemas/FiltersetUsingRef'
            rulesets:
              type: array
              description: Compliance rulesets restricted by this filterset.
              items:
                $ref: '#/components/schemas/FiltersetRulesetRef'
            thresholds:
              type: array
              description: Check thresholds, as "chk_type.chk_instance:low-high".
              items:
                type: string
            users:
              type: array
              description: Users whose session filter is this filterset.
              items:
                $ref: '#/components/schemas/FiltersetUserRef'
            comparisons:
              type: array
              description: Statistics comparisons including this filterset.
              items:
                $ref: '#/components/schemas/FiltersetComparisonRef'
            sysreport_grants:
              type: array
              description: Sysreport access granted to teams on the nodes of this filterset.
              items:
                $ref: '#/components/schemas/FiltersetSysreportGrant'

    FilterUsageResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required: [filtersets]
          properties:
            filtersets:
              type: array
              description: Filtersets holding this filter, which loses it when the filter is deleted.
              items:
                $ref: '#/components/schemas/FiltersetUsingRef'

    FiltersetUsingRef:
      type: object
      description: |
        A filterset holding the object looked up, with the logical operator of that
        entry and its number of entries.
      required: [id, fset_name, f_log_op, entries]
      properties:
        id:
          type: integer
        fset_name:
          type: string
        f_log_op:
          type: string
        entries:
          type: integer

    FiltersetUserRef:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string

    FiltersetComparisonRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    FiltersetSysreportGrant:
      type: object
      required: [id, role, pattern]
      properties:
        id:
          type: integer
        role:
          type: string
        pattern:
          type: string

    FiltersetNewEntry:
      type: object
      description: |
        An entry of a filterset being created: either a filter (f_table, f_field,
        f_op and f_value) or a nested filterset (filterset), joined to the previous
        entries by f_log_op.
      required: [f_log_op]
      properties:
        f_log_op:
          type: string
          enum: ['AND', 'AND NOT', 'OR', 'OR NOT']
        f_table:
          type: string
          description: Table the filter applies to
        f_field:
          type: string
          description: Column of f_table the filter applies to
        f_op:
          type: string
          enum: ['=', 'LIKE', '>', '>=', '<', '<=', 'IN']
        f_value:
          type: string
          description: Value to compare the column to
        filterset:
          type: string
          description: Record id or name of the filterset to nest

    FiltersetRulesetRef:
      type: object
      required: [id, ruleset_name]
      properties:
        id:
          type: integer
        ruleset_name:
          type: string

    FiltersetExport:
      type: object
      description: |
        A filterset and every filterset it encapsulates, recursively, each with its
        ordered entries. An entry holds either a filter or the name of an
        encapsulated filterset.
      required: [filtersets]
      properties:
        filtersets:
          type: array
          items:
            $ref: '#/components/schemas/FiltersetExportItem'

    FiltersetExportItem:
      type: object
      required: [id, fset_name, filters]
      properties:
        id:
          type: integer
        fset_name:
          type: string
        fset_stats:
          type: string
          nullable: true
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FiltersetExportEntry'

    FiltersetExportEntry:
      type: object
      required: [f_log_op, f_order]
      properties:
        f_log_op:
          type: string
        f_order:
          type: integer
        filter:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FiltersetExportFilter'
        filterset:
          type: string
          nullable: true
          description: Name of the encapsulated filterset, when the entry is not a filter.

    FiltersetExportFilter:
      type: object
      required: [id, f_table, f_field, f_op, f_value]
      properties:
        id:
          type: integer
        f_table:
          type: string
        f_field:
          type: string
        f_op:
          type: string
        f_value:
          type: string

    NodeHardwareRow:
      type: object
      description: |
        A hardware component of a node, as reported by the agent's asset push:
        `hw_type` is the component family (for example `pci` or `mem`), `hw_path` its
        address. Every property is optional: the `props` query parameter selects which
        columns the server returns. The `nodes.` properties come from the joined nodes
        table, null for a component of an unknown node.
      properties:
        id:
          type: integer
        node_id:
          type: string
        hw_type:
          type: string
        hw_path:
          type: string
        hw_class:
          type: string
        hw_description:
          type: string
        hw_driver:
          type: string
        updated:
          type: string
        nodes.nodename:
          type: string
          nullable: true
        nodes.app:
          type: string
          nullable: true
        nodes.os_name:
          type: string
          nullable: true

    NodeHardwareListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/NodeHardwareRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    SanTopologyNode:
      type: object
      description: |
        A device of a SAN wiring graph. `rank` is its column from the node to the
        arrays: 0 for the node, 1 for the switches its adapters are plugged in, one
        more per inter-switch link followed, and the last one for the arrays.
        `ports` are the ports the links of the graph use: adapter ports for the node,
        target ports for an array, port indexes for a switch, several of them joined
        by commas for the members of a trunk.
      required:
        - id
        - kind
        - label
        - rank
        - ports
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [server, switch, array]
        label:
          type: string
          description: Node name, switch name or array name; empty for an unknown array.
        fabric:
          type: string
          description: Fabric of a switch.
        rank:
          type: integer
        ports:
          type: array
          items:
            type: string

    SanTopologyLink:
      type: object
      description: |
        A link of a SAN wiring graph, from the device nearer to the node (`tail`) to
        the one nearer to the arrays (`head`), each with the port it uses. `speeds`
        holds the speed in Gb/s of each physical link: one, or one per member of a
        trunk between two switches; 0 when the switch does not report it.
      required:
        - tail
        - tail_port
        - head
        - head_port
        - speeds
      properties:
        tail:
          type: string
        tail_port:
          type: string
        head:
          type: string
        head_port:
          type: string
        speeds:
          type: array
          items:
            type: integer

    SanTopology:
      type: object
      required:
        - nodes
        - links
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/SanTopologyNode'
        links:
          type: array
          items:
            $ref: '#/components/schemas/SanTopologyLink'

    SanTopologyResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/SanTopology'

    SwitchPortRow:
      type: object
      description: |
        A port of a SAN switch. `sw_portname` is its own port name (WWPN),
        `sw_rportname` the port plugged on its other end and `sw_rname` the name of
        what owns that port: a node, a storage array or another switch; empty when
        the collector does not know it. `node_id` is set when it is a node. The
        numbers are null when the switch does not report them. Every property is
        optional: the `props` query parameter selects which columns the server
        returns.
      properties:
        id:
          type: integer
        sw_fabric:
          type: string
        sw_name:
          type: string
        sw_index:
          type: integer
          nullable: true
        sw_slot:
          type: integer
          nullable: true
        sw_port:
          type: integer
          nullable: true
        sw_portspeed:
          type: integer
          nullable: true
        sw_portnego:
          type: string
        sw_porttype:
          type: string
        sw_portstate:
          type: string
        sw_portname:
          type: string
        sw_rportname:
          type: string
        sw_rname:
          type: string
        node_id:
          type: string
        sw_updated:
          type: string

    SwitchPortListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/SwitchPortRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    HbaRow:
      type: object
      description: |
        A host bus adapter of a node, as reported by the agent: `hba_id` is its
        initiator identifier (an iSCSI IQN or a Fibre Channel WWPN), `hba_type` its
        transport. Every property is optional: the `props` query parameter selects
        which columns the server returns.
      properties:
        id:
          type: integer
        node_id:
          type: string
        hba_id:
          type: string
        hba_type:
          type: string
          nullable: true
        updated:
          type: string

    HbaListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/HbaRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    NetworkRow:
      type: object
      description: |
        A declared network. `begin`, `end` and `broadcast` are computed from
        `network` and `netmask`.
      properties:
        id:
          type: integer
        name:
          type: string
        network:
          type: string
        netmask:
          type: integer
        broadcast:
          type: string
        gateway:
          type: string
        begin:
          type: string
        end:
          type: string
        pvid:
          type: integer
        prio:
          type: integer
        team_responsible:
          type: string
        comment:
          type: string
        updated:
          type: string

    NetworkListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NetworkRow'
        meta:
          $ref: '#/components/schemas/ListMeta'
        info:
          type: string

    SearchGroup:
      type: object
      description: The objects of one kind matching a search.
      required:
        - kind
        - items
        - more
      properties:
        kind:
          type: string
          enum: [node, service, instance, app, network, disk, tag, user, group, privilege, request, moduleset, ruleset, filterset, form]
        items:
          type: array
          description: |
            One entry per object, with the props of its kind: node_id, nodename, app,
            node_env, cluster_id, fqdn, os_name for a node; svc_id, svcname, svc_app,
            svc_env, cluster_id, svc_availstatus, svc_topology for a service; svc_id,
            node_id, mon_vmname, mon_availstatus, services.svcname, nodes.nodename for
            an instance; id, app, app_domain, description for an application; id, addr,
            mask, mac, intf, node_id, nodename, net_name for a node address; disk_id,
            disk_name, disk_size, disk_arrayid, nodename, svcname for a disk; tag_id,
            tag_name, tag_exclude for a tag; id, email, first_name, last_name, username
            for a user; id, role, privilege, description for an organizational group
            or a privilege group; id, form_name,
            last_form_name, status, creator, last_update for a request; id,
            modset_name, modset_author for a moduleset; id, ruleset_name, ruleset_type,
            ruleset_public for a ruleset; id, fset_name, fset_author for a filterset;
            id, form_name, form_type, form_folder for a form.
          items:
            type: object
            additionalProperties: true
        more:
          type: boolean
          description: Other objects of the kind match beyond those returned.
        error:
          type: string
          description: Set when the kind could not be searched.

    SearchResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SearchGroup'

    SysreportFileStat:
      type: object
      description: A file or command output changed by a report.
      required: [path, kind, added, deleted, binary]
      properties:
        path:
          type: string
          description: Absolute path of a tracked file, or command line of a tracked command.
        kind:
          type: string
          enum: [file, command]
        added:
          type: integer
        deleted:
          type: integer
        binary:
          type: boolean

    SysreportChange:
      type: object
      description: A report that changed something.
      required: [cid, date, initial, files]
      properties:
        cid:
          type: string
        date:
          type: string
          description: Date of the report, ISO 8601 with its offset.
        initial:
          type: boolean
          description: The first report of the node, which adds every file.
        files:
          type: array
          items:
            $ref: '#/components/schemas/SysreportFileStat'

    SysreportTimelineResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SysreportChange'
        meta:
          type: object
          required: [total, limit, offset, count]
          properties:
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
            count:
              type: integer

    SysreportFileDiff:
      type: object
      required: [path, kind, added, deleted, binary, secure, restricted, truncated]
      properties:
        path:
          type: string
        kind:
          type: string
          enum: [file, command]
        added:
          type: integer
        deleted:
          type: integer
        binary:
          type: boolean
        secure:
          type: boolean
          description: The path matches a secure pattern.
        restricted:
          type: boolean
          description: The caller may not read this sensitive path, the diff is withheld.
        truncated:
          type: boolean
          description: The diff was cut at the size limit.
        diff:
          type: string
          description: Unified diff from its first hunk; absent when restricted or binary.

    SysreportChangeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [cid, date, files]
          properties:
            cid:
              type: string
            date:
              type: string
            files:
              type: array
              items:
                $ref: '#/components/schemas/SysreportFileDiff'

    SysreportPoint:
      type: object
      description: A state of the sysreport, the report it was left in; empty before the first report.
      required: [cid, date]
      properties:
        cid:
          type: string
        date:
          type: string

    SysreportTimediffResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [begin, end, files]
          properties:
            begin:
              $ref: '#/components/schemas/SysreportPoint'
            end:
              $ref: '#/components/schemas/SysreportPoint'
            files:
              type: array
              items:
                $ref: '#/components/schemas/SysreportFileDiff'

    SysreportEntry:
      type: object
      required: [oid, path, kind, size, secure, restricted]
      properties:
        oid:
          type: string
        path:
          type: string
        kind:
          type: string
          enum: [file, command]
        size:
          type: integer
        secure:
          type: boolean
        restricted:
          type: boolean

    SysreportPurgeFile:
      type: object
      required: [kind, path]
      properties:
        kind:
          type: string
          enum: [file, command]
        path:
          type: string
          description: The absolute path of a file, the command line of a command, as the sysreport routes show them

    SysreportPurgeInput:
      type: object
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/SysreportPurgeFile'
        all_nodes:
          type: boolean
          description: Purge the files from the sysreport of every node, not only this one

    SysreportPurgeNode:
      type: object
      required: [node_id, paths, rewritten, dropped, removed, kept]
      properties:
        node_id:
          type: string
        paths:
          type: array
          description: The paths of the repository the files resolved to
          items:
            type: string
        rewritten:
          type: integer
          description: Revisions recreated without the files
        dropped:
          type: integer
          description: Revisions that held nothing else, gone
        removed:
          type: integer
          description: Contents of the files destroyed
        kept:
          type: integer
          description: Contents still stored because another file of the node holds the same
        error:
          type: string

    SysreportPurge:
      type: object
      required: [id, state, node_ids, files, author, requested, nodes]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [queued, running, done, failed]
        node_ids:
          type: array
          description: The nodes to purge; empty for every node
          items:
            type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/SysreportPurgeFile'
        author:
          type: string
        requested:
          type: string
        started:
          type: string
        finished:
          type: string
        nodes:
          type: array
          description: The nodes the files were found on, as they are purged
          items:
            $ref: '#/components/schemas/SysreportPurgeNode'
        error:
          type: string

    SysreportPurgeResponse:
