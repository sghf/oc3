      description: Display a report, if the caller may see it (see GET /reports).
      parameters:
        - in: path
          name: report_id
          required: true
          description: Report identifier (reports.id)
          schema:
            type: string
        - $ref: '#/components/parameters/inQueryProps'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResponse'
        401:
          $ref: '#/components/responses/401'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /reports/{report_id}/definition:
    get:
      operationId: GetReportDefinition
      description: |
        The definition of a report, report_yaml parsed, for a caller who may see the
        report: Title, Desc, and Sections, each with a Title, a Desc, Metrics (by
        metric_id) and Charts (by chart_id). An empty definition is an empty object.
