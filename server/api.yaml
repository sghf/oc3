        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    post:
      operationId: PostSafeFile
      description: |
        Create an empty file reference, to upload its content later (POST
        /safe/{file_id}/upload): its id can be referenced first. Requires the
        SafeUploader privilege, except for a node. The file is published to and
        made the responsibility of the caller's default group. Logged.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
