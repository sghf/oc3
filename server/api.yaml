        other users only see the users sharing one of their organisational
        groups, plus themselves.
      parameters:
        - in: path
          name: user_id
          required: true
          description: |
            User identifier: auth_user.id, the user email when it contains an
            "@", or "self" for the authenticated user.
          schema:
            type: string
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
