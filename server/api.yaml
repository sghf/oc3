      - tool
      - arguments
      - expires_at
      properties:
        id:
          type: string
        turn_id:
          type: string
        tool:
          type: object
          required:
          - name
          - title
          - destructive
          properties:
            name:
              type: string
            title:
              type: string
            destructive:
              type: boolean
        arguments:
          description: The exact arguments of the call that runs if the user approves it.
        expires_at:
          type: string
          format: date-time
    AssistantMessage:
      type: object
      required:
      - id
      - turn_id
      - role
      - text
      - created_at
      properties:
        id:
          type: string
        turn_id:
          type: string
        role:
          type: string
          enum:
          - user
          - assistant
        text:
          type: string
        created_at:
          type: string
          format: date-time
        feedback:
          $ref: '#/components/schemas/AssistantFeedback'
          description: On an assistant message, the feedback of the user on its turn, if any.
    AssistantMessagePage:
      type: object
      required:
      - messages
      - next_cursor
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AssistantMessage'
          description: In chronological order.
        next_cursor:
          type: string
          description: Pass it as `before` to read the previous page; empty when there is none.
    AssistantStreamEvent:
      type: object
      required:
      - type
      description: One event of a streamed turn. The SSE event name equals `type`.
      properties:
        type:
          type: string
          enum:
          - text_delta
          - tool_started
          - tool_finished
          - usage
          - completed
          - confirmation_required
          - error
        iteration:
          type: integer
          minimum: 1
          description: The model iteration of the turn.
        text_delta:
          type: string
          description: '`text_delta`: the next piece of the answer.'
        tool_name:
          type: string
          description: '`tool_started`, `tool_finished`: the MCP tool.'
        tool_error:
          type: boolean
          description: '`tool_finished`: whether the tool failed.'
        usage:
          type: object
          description: '`usage`: the tokens of one model call.'
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer
            total_tokens:
              type: integer
        finish_reason:
          type: string
          enum:
          - completed
          - tool_calls
          - length
          - content_filter
          - other
          description: '`completed`: why the model stopped.'
        confirmation:
          $ref: '#/components/schemas/AssistantConfirmation'
          description: '`confirmation_required`: the action waiting a decision; the turn ends until it is given.'
        code:
          type: string
          enum:
          - agent_failed
          - request_timeout
          - tool_call_limit
          description: '`error`: why the turn failed. `tool_call_limit`: the model asked for more than 8 tools in one answer, or more than 16 in the turn.'
        message:
          type: string
          description: '`error`: a human-readable message.'
    AssistantError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: A stable error code.
            message:
              type: string
              description: A human-readable message.
    AssistantStatus:
      type: object
      required:
      - enabled
      - available
      properties:
        enabled:
          type: boolean
          description: Whether oc3 is configured with an AI agent (server.assistant).
        available:
          type: boolean
          description: Whether the caller can use it now.
        reason:
          type: string
          enum:
          - disabled
          - password_sign_in
          - impersonating
          - token_unavailable
          description: Why it is not available.

    Whoami:
      type: object
      required:
        - auth_source
        - privileges
        - groups
      properties:
        auth_source:
          type: string
          enum: [session, bearer, basic, node]
          description: How the request, or the impersonator, signed in.
        user_id:
          type: integer
          nullable: true
          description: The user, none for a node.
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        issuer:
          type: string
          nullable: true
          description: The provider of a single sign-on.
        subject:
          type: string
          nullable: true
          description: The user's identity at the provider.
        privileges:
          type: array
          items:
            type: string
          description: The privilege groups of the user, sorted.
        groups:
          type: array
          items:
            type: string
          description: The other groups of the user, sorted.
        expires:
          type: string
          format: date-time
          nullable: true
          description: When the session, or the access token, ends whatever the activity.
        idle_expires:
          type: string
          format: date-time
          nullable: true
          description: When an idle session ends.
        impersonator:
          type: object
          nullable: true
          description: The Manager impersonating the user, if any.
          required: [user_id, email, name]
          properties:
            user_id:
              type: integer
            email:
              type: string
            name:
              type: string
        node:
          type: object
          nullable: true
          description: The node, for a node's credentials.
          required: [node_id, nodename]
