        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /logs/{log_id}:
    get:
      operationId: GetLog
      description: Display a collector log event properties
      parameters:
        - in: path
          name: log_id
          required: true
          description: Log event identifier (log.id)
          schema:
            type: string
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
        - $ref: '#/components/parameters/inQueryOffset'
        - $ref: '#/components/parameters/inQueryMeta'
