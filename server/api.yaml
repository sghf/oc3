      description: |
        A user group. `privilege` is "T" for a privilege-granting group and
        "F" for an ordinary one. Every property is optional: the `props` query
        parameter selects which columns the server returns.
      properties:
        id:
          type: integer
        role:
          type: string
        privilege:
          type: string
        description:
          type: string

    GroupListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/GroupRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    Impersonation:
      type: object
      required: [user_id, email, groups]
      properties:
        user_id:
          type: integer
          format: int64
          description: auth_user.id to send in the OC3-Impersonate header.
        email:
          type: string
        groups:
          type: array
          description: The groups of the impersonated user.
          items:
            type: string

    ImpersonationStatus:
      type: object
      required: [allowed]
      properties:
        allowed:
          type: boolean
          description: Whether the user who signed in holds the Manager privilege, which impersonating requires.
        impersonating:
          $ref: '#/components/schemas/Impersonation'

    UserRow:
      type: object
      description: |
        A user of the users list. `password`, `registration_key` and
        `reset_password_key` are never
        returned. The boolean-like columns (`email_notifications`,
        `im_notifications`, `lock_filter`) carry the collector's "T"/"F"
        convention, and the delay and quota columns are returned as strings.
        Every property is optional: the `props` query parameter selects which
        columns the server returns.
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone_work:
          type: string
        im_type:
          type: string
        im_username:
          type: string
        email_notifications:
          type: string
        im_notifications:
          type: string
        email_log_level:
          type: string
        im_log_level:
          type: string
        email_notifications_delay:
          type: string
        im_notifications_delay:
          type: string
        lock_filter:
          type: string
        registration_id:
          type: string
        quota_app:
          type: string
        quota_org_group:
          type: string
        quota_docker_registries:
          type: string

    UserPrefsResponse:
      type: object
      required:
        - data
      description: |
        The stored preferences, as saved by POST /users/{user_id}/prefs. The
        collector never interprets the content; an empty object means "no
        preferences stored", "user unknown" or "user not visible" alike.
      properties:
        data:
          type: object
          additionalProperties: true

    UserListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/UserRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    ActionEnqueueListResult:
      type: object
      description: The answer to a list of entries of PUT /actions.
      required: [info, error, data, refusals]
      properties:
        info:
          type: array
          items:
            type: string
        error:
          type: array
          description: One message per refused entry, naming its target
          items:
            type: string
        data:
          type: array
          description: The queued actions, as GET /actions/{id} returns them
          items:
            type: object
        refusals:
          type: array
          items:
            type: object
            required: [index, message]
            properties:
              index:
                type: integer
                description: Index of the refused entry in the list sent, from 0
              message:
                type: string

    AlertsDeleteInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 10000
          items:
            type: integer

    AlertsDeleteResult:
      type: object
      required: [deleted, not_found]
      properties:
        deleted:
          type: integer
        not_found:
          type: array
          items:
            type: integer

    BatchOutcome:
      type: object
      description: What became of one object of a batch, as its single route would answer
      required: [id, status, info]
      properties:
        id:
          type: string
        status:
          type: integer
          description: The http status the single route would answer with
        info:
          type: string

    BatchResult:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BatchOutcome'

    IdsInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string

    InstancesInput:
      type: object
      required: [instances]
      properties:
        instances:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [svc_id, node_id]
            properties:
              svc_id:
                type: string
              node_id:
                type: string

    ActionsAckInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: integer
            format: int64
        acked_comment:
          type: string

    ChecksBatchInput:
      type: object
      required: [action, ids]
      properties:
        action:
          type: string
          enum: [set_thresholds, reset_thresholds, delete]
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: integer
            format: int64
        chk_low:
          type: integer
          format: int64
        chk_high:
          type: integer
          format: int64

    ListResponse:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: array
              items:
                type: object
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    Problem:
      type: object
      properties:
        text:
          description: |
            A human-readable explanation specific to this occurrence of the
            problem.
          type: string
      required:
        - text

    version:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          example: "0.0.1"
        service:
          type: string
          description: The oc3 component answering, server or feeder.
          example: server
        api_docs:
          type: boolean
          description: |
            The API documentation (Swagger UI) is served, at the root of the API
            path (`<ui.enable>` of the component's configuration).

    OrchestrationTargetKind:
      type: string
      description: |
        What the action of a step acts on: a service as a whole, the instance of a
        service on a node, a node, or a cluster.
      enum: [service, instance, node, cluster]

    OrchestrationTargets:
      type: object
      description: |
        How a step names its targets. pick: the ids, svc_id for a service,
        "svc_id@node_id" for an instance, node_id for a node, cluster_id for a
        cluster. filterset: the services, the nodes, the instances of the services
        on the nodes, or the clusters of the nodes, the filterset matches when the
        run starts. same_as: the targets of an earlier step, of the same kind.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [pick, filterset, same_as]
        ids:
          type: array
          items:
            type: string
        filterset_id:
          type: integer
        step:
          type: integer
          description: For same_as, the index of the earlier step, from 0

    OrchestrationStep:
      type: object
      description: |
        One action on a set of targets. The action must be one the action queue
        accepts for the kind of target (see PUT /actions); rid, the resources of
        an instance, applies to instances only. pace says how many targets run at
        a time: all, one (one after the other) or batch (batch_size at a time).
        timeout, in seconds, fails a target whose action has not finished by
        then; 0 means no limit.
      required: [name, action, kind, targets, pace]
      properties:
        name:
          type: string
        action:
          type: string
        kind:
          $ref: '#/components/schemas/OrchestrationTargetKind'
        targets:
          $ref: '#/components/schemas/OrchestrationTargets'
        rid:
          type: string
        pace:
          type: string
          enum: [all, one, batch]
        batch_size:
          type: integer
          minimum: 1
        timeout:
          type: integer
          minimum: 0

    OrchestrationInput:
      type: object
      required: [name, steps]
      properties:
        name:
          type: string
        description:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/OrchestrationStep'

    Orchestration:
      type: object
      required: [id, name, description, steps, created, updated, updated_by]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/OrchestrationStep'
        created:
          type: string
        updated:
          type: string
        updated_by:
          type: string
          description: Email of the author of the last change

    OrchestrationRow:
      type: object
      description: |
        An orchestration, as listed. Every property is optional: the `props` query
        parameter selects which columns the server returns.
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        steps:
          type: string
          description: The steps, as JSON (an array of OrchestrationStep).
        step_count:
          type: integer
        created:
          type: string
        updated:
          type: string
        updated_by:
          type: string
        run_count:
          type: integer
        last_run_id:
          type: integer
          nullable: true
        last_run_status:
          type: string
          nullable: true
          description: The status of its last run, null when never run.
        last_run_started:
          type: string
          nullable: true

    OrchestrationListResponse:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/OrchestrationRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

    OrchestrationCheckTarget:
      type: object
      required: [label, ok, message]
      properties:
        node_id:
          type: string
        svc_id:
          type: string
        cluster_id:
          type: string
        label:
          type: string
          description: The name of the target, as the run shows it
        ok:
          type: boolean
        message:
          type: string
          description: Why the action queue would refuse the target, empty when ok

    OrchestrationCheckStep:
      type: object
      required: [step, targets, message]
      properties:
        step:
          type: integer
        targets:
          type: array
          items:
            $ref: '#/components/schemas/OrchestrationCheckTarget'
        message:
          type: string
          description: What makes the step itself invalid, empty when it is valid

    OrchestrationCheckResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrchestrationCheckStep'

    OrchestrationRunStatus:
      type: string
      enum: [running, succeeded, failed, stopped]

    OrchestrationRunStepStatus:
      type: string
      description: |
        stopped: the run was stopped during the step; not_run: the run failed or
        was stopped before it; acknowledged: the step failed or was stopped, and
        its outcome was accepted for the run to go on (see POST /orchestration_runs/{run_id}/continue).
      enum: [waiting, running, succeeded, failed, acknowledged, stopped, not_run]

    OrchestrationRunTargetStatus:
      type: string
      description: |
        waiting: not started; queued: its action waits in the queue; running: an
        agent runs it; ok: it returned 0; failed: it returned non-zero; refused:
        the queue refused it; timed_out: it outlived the time limit of the step;
        cancelled: its action was cancelled or deleted; not_run: the run stopped
        before it.
      enum: [waiting, queued, running, ok, failed, refused, timed_out, cancelled, not_run]

    OrchestrationRunTarget:
      type: object
      required: [id, step, position, node_id, svc_id, cluster_id, label, status, message]
      properties:
        id:
          type: integer
        step:
          type: integer
        position:
          type: integer
        node_id:
          type: string
        svc_id:
          type: string
        cluster_id:
          type: string
        label:
          type: string
        status:
          $ref: '#/components/schemas/OrchestrationRunTargetStatus'
        action_id:
          type: integer
          nullable: true
        ret:
          type: integer
          nullable: true
        stdout:
          type: string
        stderr:
          type: string
        command:
          type: string
        message:
          type: string
          description: Why it did not succeed, when the action queue or the run says so
        queued:
          type: string
          nullable: true
        started:
          type: string
          nullable: true
        ended:
          type: string
          nullable: true

    OrchestrationRunStep:
      type: object
      required: [step, status, counts]
      properties:
        step:
          type: integer
        status:
          $ref: '#/components/schemas/OrchestrationRunStepStatus'
        started:
          type: string
          nullable: true
        ended:
          type: string
          nullable: true
        acked_by:
          type: string
          description: Who acknowledged the failure of the step, empty when none did
        acked_at:
          type: string
          nullable: true
        ack_comment:
          type: string
          description: Why the failure was acknowledged
        counts:
          type: object
          description: The number of targets by status
          additionalProperties:
            type: integer
        targets:
          type: array
          description: Absent from the list of runs
          items:
            $ref: '#/components/schemas/OrchestrationRunTarget'

    OrchestrationRun:
      type: object
      required: [id, name, plan, status, current_step, started, started_by, message, steps]
      properties:
        id:
          type: integer
        orchestration_id:
          type: integer
          nullable: true
          description: Null once the orchestration is deleted
        name:
          type: string
        plan:
          type: array
          description: The steps of the orchestration when the run started
          items:
            $ref: '#/components/schemas/OrchestrationStep'
        status:
          $ref: '#/components/schemas/OrchestrationRunStatus'
        current_step:
          type: integer
        started:
          type: string
        ended:
          type: string
          nullable: true
        started_by:
          type: string
        message:
          type: string
          description: Why the run failed or was stopped
        steps:
          type: array
          items:
            $ref: '#/components/schemas/OrchestrationRunStep'

    WikiRevision:
      type: object
      required: [id, saved_on, author, change_note]
      properties:
        id:
          type: integer
          format: int64
        saved_on:
          type: string
          format: date-time
        author:
          type: string
          description: The email of the user who saved it, empty when unknown
        change_note:
          type: string
          description: What the revision changed, in a few words; may be empty
        body:
          type: string
          description: The notes, in Markdown; absent from a list of revisions

    WikiPage:
      type: object
      required: [revision, revisions, total, writable]
      properties:
        revision:
          description: The latest revision, with its body; null when none was saved
          nullable: true
          allOf:
            - $ref: '#/components/schemas/WikiRevision'
        revisions:
          type: array
          description: The revisions, the latest first, without their body
          items:
            $ref: '#/components/schemas/WikiRevision'
        total:
          type: integer
          description: How many revisions the page has in all
        writable:
          type: boolean
          description: Whether the caller may save a revision

    WikiRevisionInput:
      type: object
      required: [body, base_id]
      properties:
        body:
          type: string
          description: The notes, in Markdown, at most 60000 bytes
        change_note:
          type: string
          description: What the revision changes, at most 200 characters
        base_id:
          type: integer
          format: int64
          description: The revision edited, 0 when the page has none

    OrchestrationRunContinueInput:
      type: object
      required: [comment]
      properties:
        comment:
          type: string
          description: Why the failure of the step is accepted

    OrchestrationRunRow:
      type: object
      description: |
        A run, as listed. Every property is optional: the `props` query parameter
        selects which columns the server returns.
      properties:
        id:
          type: integer
        orchestration_id:
          type: integer
          nullable: true
        name:
          type: string
        status:
          type: string
          description: running, succeeded, failed or stopped.
        current_step:
          type: integer
        message:
          type: string
        started:
          type: string
        ended:
          type: string
          nullable: true
        started_by:
          type: string
        step_count:
          type: integer
        steps_done:
          type: integer
          description: Its steps succeeded, or failed and acknowledged.
        duration:
          type: integer
          description: Seconds from its start to its end, or to now while it runs.

    OrchestrationRunListResponse:
      type: object
      required: [data]
      properties:
        data:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/OrchestrationRunRow'
            - type: object
              additionalProperties:
                type: object
                additionalProperties:
                  type: integer
        meta:
          $ref: '#/components/schemas/ListMeta'

  parameters:
    inPathOrchestrationId:
      in: path
      name: orchestration_id
      required: true
      description: ID of the orchestration
      schema:
        type: integer

    inPathOrchestrationRunId:
      in: path
      name: run_id
      required: true
      description: ID of the orchestration run
      schema:
        type: integer

    ObjectPathHeader:
      name: OC3-ObjectPath
      in: header
      schema:
        type: string

    inPathMsetId:
      in: path
      name: mset_id
      required: true
      description: ID of the moduleset
      schema:
        type: string

    inPathNodeId:
      in: path
      name: node_id
      required: true
      description: ID of the node
      schema:
        type: string

    inPathRsetId:
      in: path
      name: rset_id
      required: true
      description: ID of the ruleset
      schema:
        type: string

    inQueryGroupby:
      in: query
      name: groupby
      required: false
      description: Comma-separated list of properties to group the result by (e.g. groupby=app,svcname).
      schema:
        type: string

    inQueryLimit:
      in: query
      name: limit
      required: false
      description: The maximum number of entries to return. 0 means no limit.
      schema:
        type: integer
        minimum: 0
        default: 50

    inQueryMeta:
      in: query
      name: meta
      required: false
      description: |
        Include metadata in the response. Enabled by default. Use false or 0 to omit
        the meta field. The metadata of a list carries its total number of rows
        without pagination (total), as well as the rows returned (count), the offset
        and the limit.
      schema:
        type: string

    inQueryOffset:
      in: query
      name: offset
      required: false
      description: Skip the first entries of the data cursor.
      schema:
        type: integer
        minimum: 0
        default: 0

    inQueryOrderby:
      in: query
      name: orderby
      required: false
      description: Comma-separated list of properties to sort by. Prefix a property with - for descending order (e.g. orderby=nodename,-app).
      schema:
        type: string

    inQueryFilter:
      in: query
      name: filter
      required: false
      description: |
        Column filter, repeatable; several filters combine with AND. Each value is
        `prop:expr`, `prop` being a property of the list (joined ones included, as
        for orderby) and `expr` one of:
          - text: case-insensitive match anywhere in the value;
          - `~regex`: regular expression (RE2 syntax), case-insensitive;
          - `in:a,b,c`: one of the listed values;
          - `eq:v`, `ne:v`: equal, not equal;
          - `gt:v`, `gte:v`, `lt:v`, `lte:v`: comparisons, for numbers and dates;
            a date may be relative to now, `-` then a duration in weeks, days,
            hours, minutes and seconds: `lt:-15m` keeps the dates older than 15
            minutes, `gte:-1d12h` those of the last day and a half;
          - `empty`: no value;
          - `!expr`: the inverse of any of the above, that is the rows `expr` leaves
            out, those without a value included: `!dev`, `!~^dev`, `!in:a,b`,
            `!empty` (any value).
        An unknown property, a property without a column, or an invalid regular
        expression is answered with 400.
      explode: true
      schema:
        type: array
        items:
          type: string

    inQueryProps:
      in: query
      name: props
      required: false
      description: A list of properties to include in each data dictionnary.
      schema:
        type: string

    inQueryStats:
      in: query
      name: stats
      required: false
      description: |
        With "1" or "true", the response counts the distinct values of each
        selected property instead of listing the rows: `data` maps each property
        to an object of value → number of rows ("empty" for a null or blank
        value), over the whole selection (access control, filters and session
        filterset applied, `offset` ignored). `limit`, when given, caps the
        number of values returned per property, the most frequent first; without
        it every value is returned. `meta.total` is the number of rows,
        `meta.distinct` the number of distinct values of each property, and
        `meta.other` the number of rows whose value was left out by the limit.
        A count taking longer than 5 seconds is refused with a 400, asking to
        narrow the selection.
      schema:
        type: string

    inQuerySync:
      in: query
      name: sync
      schema:
        type: boolean

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
