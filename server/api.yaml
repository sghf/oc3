    ComplianceStatusRow:
      type: object
      description: |
        The last run of a compliance module on a node, or on a service's instance
        on it. Every property is optional: the `props` query parameter selects which
        columns the server returns. `run_status` is the module's exit code: 0 ok,
        1 not ok, 2 not applicable.
      properties:
        id:
          type: integer
        run_module:
          type: string
        node_id:
          type: string
        svc_id:
          type: string
        run_status:
          type: integer
        run_log:
          type: string
        run_date:
          type: string
        run_action:
          type: string
        rset_md5:
          type: string
        nodes.nodename:
          type: string
          nullable: true
        services.svcname:
          type: string
          nullable: true

    ComplianceStatusCounts:
      type: object
      description: |
        Check runs by state: ok, not ok and not applicable among the runs of the last
        7 days, obsolete past them. `total` is their sum; `pct` the share of ok and
        not applicable runs, rounded down, null without any run.
      required: [total, ok, nok, na, obs, pct]
      properties:
        total:
          type: integer
        ok:
          type: integer
        nok:
          type: integer
        na:
          type: integer
        obs:
          type: integer
        pct:
          type: integer
          nullable: true

    ComplianceStatusGroup:
      description: |
        The counts of one module, node or service. `id` is the module name, the
        node id or the service id; `name` the module, node or service name.
      allOf:
        - $ref: '#/components/schemas/ComplianceStatusCounts'
        - type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string

