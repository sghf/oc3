  /tags/{tag_id}:
    post:
      operationId: PostTag
      description: |
        Update the properties of a tag. tag_name is trimmed and may be neither
        empty, nor longer than 128 characters, nor the name of another tag (409).
        tag_exclude, 128 characters at most, is a regular expression (MySQL
        REGEXP) of the tag names an object carrying this tag may not carry; an
        expression the database refuses is answered with a 400. The empty string
        excludes nothing.
      parameters:
        - in: path
          name: tag_id
          required: true
          description: The tag_id of the tag (a UUID), or its record id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tag_name:
                  type: string
                tag_exclude:
                  type: string
                tag_data:
                  type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    delete:
      operationId: DeleteTag
      description: Delete the tag and its attachments to nodes and services
      parameters:
        - in: path
          name: tag_id
          required: true
          description: The tag_id of the tag (a UUID), or its record id
          schema:
            type: string
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
    get:
      operationId: GetTag
      description: Display tag property
      parameters:
        - in: path
          name: tag_id
          required: true
          description: The tag_id of the tag (a UUID), or its record id
          schema:
            type: string
        - $ref: '#/components/parameters/inQueryProps'
      tags:
        - collector
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

