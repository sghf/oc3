  /auth/node:
    post:
      description: |
        Register a node authentication

        A node authenticated by its own credentials, the enroller, may
        register another node joining its cluster, when server.allow_node_enroll
        is set. The joining node must be already registered: it is found by its
        nodename and its previous uuid, else it registers itself. It moves to
        the app, the team responsible and the cluster of the enroller, and gets
        a new uuid, which the enroller hands to it.
      operationId: PostAuthNode
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required:
                - nodename
              properties:
                nodename:
                  type: string
                app:
                  type: string
                  description: |
                    The app of the node. Ignored for a joining node, which
                    takes the app of the enroller.
                uuid:
                  type: string
                  description: |
                    The previous uuid of the joining node, required to
                    register a joining node.
                cluster_id:
                  type: string
                  description: |
                    The cluster id of the node, set on the node so it is
                    known before its first daemon status. Absent or empty, the
                    node cluster id is left untouched. Ignored for a joining
                    node, which takes the cluster id of the enroller.
      responses:
        200:
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - uuid
                  - info
                properties:
                  uuid:
                    type: string
                  info:
                    type: string
        403:
          $ref: '#/components/responses/403'
        409:
          $ref: '#/components/responses/409'
        500:
          $ref: '#/components/responses/500'
      security:
        - { }
        - basicAuth: [ ]
        - bearerAuth: [ ]
      tags:
        - auth

  /auth/backchannel-logout:
    post:
      operationId: PostAuthBackchannelLogout
      description: |
        OpenID Connect Back-Channel Logout 1.0: the provider ends the sessions of a
        user or of one of its sign-ins. The logout token is verified (signature,
        issuer, audience, issue time, event, no nonce), then the sessions it names
        by sid, or else by sub, are deleted. Public: the provider authenticates
        itself by the signature of the token.
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              properties:
                logout_token:
                  type: string
      responses:
        200:
          description: The sessions named by the token are ended.
        400:
          $ref: '#/components/responses/400'
        503:
          description: The OpenID Connect provider is not reachable yet.

  /auth/callback:
    get:
      operationId: GetAuthCallback
      description: |
        End of an OpenID Connect sign-in, where the provider sends the browser back.
        The sign-in in progress (cookie) is consumed, the state checked, the code
        exchanged with the PKCE verifier, the ID token verified, the account
        resolved from the (issuer, subject) identity, and a session opened in an
        HttpOnly cookie. Always answers a redirection: to the path the sign-in
        started from, or to it with an auth_error parameter naming the failure
        (state, expired, token, unknown_user, locked, denied, unavailable).
      tags:
        - auth
      parameters:
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
        - in: query
          name: error
          schema:
            type: string
      responses:
        303:
          description: Back to the SPA.

  /auth/claims:
    get:
      operationId: GetAuthClaims
      description: |
        The claims of the OpenID Connect sign-in of the request, those a claim rule
        may use (the claims that only serve to verify the token are left out), so
        that whoever writes the rules sees what the provider sends. Empty for a
        request authenticated otherwise.
      tags:
        - auth
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [source, claims]
                properties:
                  source:
                    type: string
                    description: How the request was authenticated (session, bearer, basic)
                  claims:
                    type: object
                    additionalProperties: true
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]

  /auth/info:
    get:
      operationId: GetAuthInfo
      description: |
        The sign-in modes the collector offers, for the sign-in screen, and whether
        the request carries a valid OpenID Connect session. Public.
      tags:
        - auth
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthInfo'

  /auth/whoami:
    get:
      operationId: GetAuthWhoami
      description: |
        Who the request is authenticated as, and how: the source of the sign-in
        (session for a single sign-on session cookie, bearer for a provider's
        access token, basic for a password, node for a node's credentials), the
        user, their privilege groups and their other groups, and, for a single
        sign-on, the identity at the provider and when the sign-in ends.

        While impersonating, the user, privileges and groups are those of the
        impersonated user; auth_source, issuer, subject and the ends describe the
        sign-in of the impersonator, given in impersonator.

        No token, password nor session id appears. The answer is not cached; it
        reads the current state of each request, do not poll it.
      tags:
        - auth
      security:
        - basicAuth: [ ]
        - bearerAuth: [ ]
      responses:
        200:
          description: OK
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Whoami'
        401:
          $ref: '#/components/responses/401'
        500:
          $ref: '#/components/responses/500'

  /auth/login:
    get:
      operationId: GetAuthLogin
      description: |
        Starts an OpenID Connect sign-in (authorization code flow with PKCE): fresh
        state, nonce and code verifier are kept on the server, a short-lived
        HttpOnly cookie names the sign-in, and the browser is redirected to the
        provider. return_to must be a path of the SPA; anything else is replaced
        by /.
      tags:
        - auth
      parameters:
        - in: query
          name: return_to
          description: Path of the SPA to come back to once signed in
          schema:
            type: string
      responses:
        302:
          description: To the provider's authorization endpoint.
        404:
          description: OpenID Connect is not enabled.
        503:
          description: The OpenID Connect provider is not reachable yet.

  /auth/logout:
    post:
      operationId: PostAuthLogout
      description: |
        Ends the OpenID Connect session of the request and clears its cookie, then
        returns the provider's end-session URL (RP-initiated logout) for the SPA to
        follow, empty when the provider has none. Protected against cross-site
        requests: the X-OC3-CSRF header is required and the Origin must be the
        SPA's.
      tags:
        - auth
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [logout_url]
                properties:
                  logout_url:
                    type: string
        403:
          $ref: '#/components/responses/403'

  /charts:
    get:
      operationId: GetCharts
      description: |
        List the charts: time series of historized metrics, defined in YAML. A manager sees
        every chart; the others see the charts published to one of their teams.
      parameters:
        - $ref: '#/components/parameters/inQueryProps'
        - $ref: '#/components/parameters/inQueryLimit'
